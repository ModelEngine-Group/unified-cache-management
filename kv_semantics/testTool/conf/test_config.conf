testmode = 1 # 输入文件类型。 1: input.txt不带value  2： input.txt带value
runtime = 10 # 运行时长。单位：分钟。 >0 压测到达时间后退出； runtime=0 为循环模式，以loop为准。
loop = 1 # 请求循环执行次数。当runtime = 0 时生效，此时loop需要大于0。
perf = on # on: 无日志，测性能。 off：输出日志，不测性能
onlyconnect = off # on: 只建链，不下IO  off: 建链、下IO

startcoreid = 24 # 工具绑的起始核
numjobs = 16 # 向kv client发送数据的线程数量

# log 参数
readlogdir = log/get # 读log的位置
logdir = log/ # 日志输出目录
log.level = info # 全量日志最低级别：debug|info|warn|error
log.pattern = [%Y-%m-%d %H:%M:%S.%e] [%l] [%t] %v # 日志输出格式（值不能含 '#'；语法同 spdlog pattern）
log.file_name = nds_%Y%m%d_%H.log # 全量日志文件名（%Y%m%d_%H 等时间标记按启动时刻展开）
log.warn_file_name = nds_warn_%Y%m%d_%H.log # warn 专用文件名（记录 warn 及以上）
log.error_file_name = nds_error_%Y%m%d_%H.log # error 专用文件名（记录 error 及以上）
log.max_file_size = 65536 # 单文件大小上限（字节），写满滚动
log.max_files = 4 # 滚动文件保留个数（不含活跃文件；0 不清理）
log.async_queue_size = 8192 # 异步队列长度（满则阻塞）
log.async_flush_interval_ms = 100 # 周期刷盘间隔（毫秒）
