name: Release operations contracts

on:
  pull_request:
    paths:
      - .github/release-operations/**
      - .github/ISSUE_TEMPLATE/900-release-checklist.yml
      - .github/ISSUE_TEMPLATE/400-bug-report.yml
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/release-operations*.yml
      - .github/workflows/release-tag.yml
      - .github/workflows/release-ucm.yml

permissions:
  contents: read

concurrency:
  group: release-operations-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Test release management and native associations
        run: python -m unittest discover -s .github/release-operations -p 'test_*.py' -v
