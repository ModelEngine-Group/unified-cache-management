name: UCM Documentation · Check RTD build

on:
  pull_request:
    paths:
      - docs/docs-site/**
      - .github/release/**
      - .github/actionlint.yaml
      - .pre-commit-config.yaml
      - pyproject.toml
      - setup.py
      - version.ini
      - requirements-build.txt
      - .github/workflows/release*.yml
      - .github/workflows/nightly-cleanup.yml
      - .github/workflows/cleanup-ucm-release.yml
      - .github/workflows/_build*.yml
      - .github/workflows/sync-builders.yml
      - .github/workflows/ucm-build-bot.yml
      - .github/workflows/pull-request.yml
      - .github/workflows/push-check.yml
      - .github/workflows/lint-and-test.yml
      - .github/workflows/_probe-runtime.yml
      - .github/workflows/_native-wheel-gate.yml
      - .github/actions/**
      - scripts/materialize_version.py
      - .readthedocs.yaml
      - .github/workflows/docs-check.yml
  push:
    paths:
      - docs/docs-site/**
      - .github/release/**
      - .github/actionlint.yaml
      - .pre-commit-config.yaml
      - pyproject.toml
      - setup.py
      - version.ini
      - requirements-build.txt
      - .github/workflows/release*.yml
      - .github/workflows/nightly-cleanup.yml
      - .github/workflows/cleanup-ucm-release.yml
      - .github/workflows/_build*.yml
      - .github/workflows/sync-builders.yml
      - .github/workflows/ucm-build-bot.yml
      - .github/workflows/pull-request.yml
      - .github/workflows/push-check.yml
      - .github/workflows/lint-and-test.yml
      - .github/workflows/_probe-runtime.yml
      - .github/workflows/_native-wheel-gate.yml
      - .github/actions/**
      - scripts/materialize_version.py
      - .readthedocs.yaml
      - .github/workflows/docs-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release · Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install release test dependencies
        run: python -m pip install -r .github/release/requirements-dev.txt
      - name: Test release behavior
        run: |
          mkdir -p out
          python -m pytest -q .github/release/tests \
            --junitxml=out/release-tests.xml \
            --basetemp=out/release-test-tmp
      - name: Upload release contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ucm-release-contracts-run-${{ github.run_id }}
          path: |
            out/release-tests.xml
            out/release-test-tmp/**/named-draft-meta-wheelhouse/*.whl
          if-no-files-found: warn
          retention-days: 7
  check:
    name: Docs · Build and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install documentation and test dependencies
        run: python -m pip install -r docs/docs-site/requirements-dev.txt
      - name: Test documentation contracts
        run: python -m pytest -q docs/docs-site/tests
      - name: Test installation renderer
        run: node --test docs/docs-site/tests/install-ui.test.cjs
      - name: Build both RTD language roots with real published installation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python docs/docs-site/tools/site.py build --lang en --strict \
            --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_SHA}" \
            --site-url https://docs.example.invalid/en/latest/
          python docs/docs-site/tools/site.py build --lang zh --strict \
            --repository "${GITHUB_REPOSITORY}" --ref "${GITHUB_SHA}" \
            --site-url https://docs.example.invalid/zh-cn/latest/
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ucm-docs-${{ github.sha }}
          path: docs/docs-site/site/
          if-no-files-found: error
          retention-days: 14

  publish-latest:
    name: Docs · Publish bilingual latest
    needs: [release, check]
    if: >-
      ${{ github.ref == 'refs/heads/develop' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - id: docs
        name: Resolve documentation publication
        env:
          RTD_PROJECT_EN: ${{ vars.RTD_PROJECT_EN }}
          RTD_PROJECT_ZH: ${{ vars.RTD_PROJECT_ZH }}
          RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
        run: |
          if [ "${GITHUB_REPOSITORY}" != ModelEngine-Group/unified-cache-management ] &&
             [ -z "${RTD_PROJECT_EN}${RTD_PROJECT_ZH}${RTD_API_TOKEN}" ]; then
            echo "RTD is not configured for this fork; skipping documentation publication."
            echo "enabled=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ -z "${RTD_PROJECT_EN}" ] || [ -z "${RTD_PROJECT_ZH}" ] || [ -z "${RTD_API_TOKEN}" ]; then
            echo "::error::Configure RTD_PROJECT_EN, RTD_PROJECT_ZH and RTD_API_TOKEN before publishing."
            exit 1
          fi
          echo "enabled=true" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4.2.2
        if: ${{ steps.docs.outputs.enabled == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        if: ${{ steps.docs.outputs.enabled == 'true' }}
        with:
          python-version: "3.12"
      - name: Install publication dependencies
        if: ${{ steps.docs.outputs.enabled == 'true' }}
        run: python -m pip install -r .github/release/requirements.txt
      - name: Build and verify both public language roots
        if: ${{ steps.docs.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
          RTD_PROJECT_EN: ${{ vars.RTD_PROJECT_EN }}
          RTD_PROJECT_ZH: ${{ vars.RTD_PROJECT_ZH }}
        run: |
          python docs/docs-site/tools/trigger_rtd.py --latest \
            --repository "${GITHUB_REPOSITORY}" --source-sha "${GITHUB_SHA}" \
            --project "${RTD_PROJECT_EN}" --project "${RTD_PROJECT_ZH}" \
            --output out/docs-receipt.json
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && steps.docs.outputs.enabled == 'true' }}
        with:
          name: ucm-docs-latest-receipt-run-${{ github.run_id }}
          path: out/docs-receipt.json
          if-no-files-found: warn
          retention-days: 14
