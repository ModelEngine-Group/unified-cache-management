# UCM ASU AIV backend example for vLLM / vLLM-Ascend integration.
#
# Use with:
# kv_connector_extra_config={"UCM_CONFIG_FILE": "/workspace/unified-cache-management/examples/ucm_config_asu.yaml"}

ucm_connectors:
  - ucm_connector_name: "UcmPipelineStore"
    ucm_connector_config:
      store_pipeline: "ASU"
      asu_mode: "client"
      # Use batch Load/Store protocol even for a single entry (default: true).
      # Set false to use single-key protocol for single-entry requests.
      asu_use_batch_io_for_single_key: true
      asu_client_id: "ucm-vllm-asu-aiv"
      # For multiple ASUs, list every ASU here and provide asu_ips/asu_ports in the same order,
      # for example: asu_ids: [1, 2]
      asu_ids: [1]
      asu_trans_provider_backend: "aiv"
      # 0 creates one provider per transport; 1 shares one provider within this client process.
      asu_shared_provider: 0

      # Non-FAWA models use one ASU namespace. For DeepSeek V4 / FAWA,
      # replace this with: kv_ns_ids: [100, 101]  # [FA, WA]
      kv_ns_ids: [100]

      # cpu ip where mock server runs
      # Multi-ASU example: asu_ips: ["223.223.8.11", "223.223.8.12"]
      # Multi-ASU example: asu_ports: [19001, 19002]
      asu_ips: ["223.223.8.11"]
      asu_ports: [19001]
      # ASU client routing.
      asu_router_type: "RING_HASH"
      asu_ring_hash_virtual_node_count: 128

      # Local software backend. This uses normal KvClient + AsuTransportImpl submit/CQE paths
      # and replaces the missing device Send/backend execution with local files.
      # asu_fake_backend_path: "./asu-fake-backend-store"
      # asu_fake_backend_latency_ms: 1
      # asu_fake_backend_worker_threads: 4
      # Set true to bypass fake-backend IO; lookups miss while other requests complete successfully.
      asu_fake_backend_complete_immediately: false

      # HCCP KV-over-RoCE backend: set asu_trans_provider_backend to
      # "hccp_kv_over_roce" (alias "hccp"), then optionally override the provider
      # defaults. The provider needs asu_ips/asu_ports for every ASU.
      # asu_hccp_kv_roce_lib_path: "/usr/local/lib/libhccp_kv_over_roce.so"
      # asu_hccp_kv_roce_max_connections: 3072
      # InitConfig overrides; omitted fields keep the defaults documented in
      # hccp_kv_over_roce_abi.h. Keys use the ABI field name in snake_case.
      # asu_hccp_kv_roce_mem_size: 671088640
      # asu_hccp_kv_roce_oob_transport: 0
      # asu_hccp_kv_roce_sdk_ioq_depth: 128
      # asu_hccp_kv_roce_timeout_ms: 60000
      # asu_hccp_kv_roce_max_inflight_kv_per_ip: 2048

      # ASU wait/task timeout and connection recovery.
      asu_wait_timeout_ms: 5000
      asu_query_timeout_ms: 500
      asu_max_error_count: 2
      asu_client_max_inflight_tasks: 1024
      asu_transport_max_inflight_tasks: 1024
      asu_sc: true
      asu_completion_poll_spin_limit: 16

enable_event_sync: true
use_layerwise: false
persist_token_threshold: 0

# ---------------------------------------------------------------------------
# CPU-over-RoCE transport provider (asu_trans_provider_backend: "cpu", or
# "cpu_roce" for the same provider under the CPU IO name).
# The keys below are the ones the provider reads; see
# kv_semantics/docs/guide/roce-provider.md for the full table and defaults.
#
#      asu_trans_provider_backend: "cpu_roce"
#      # Required: there is no automatic GID selection.
#      asu_roce_gid_index: 0
#      # Optional tuning.
#      asu_roce_hca_name: "mlx5_0"
#      asu_roce_hca_port: 1
#      asu_roce_sl: 3
#      asu_roce_traffic_class: 104
#      asu_roce_qp_timeout: 17
#      asu_roce_retry_cnt: 7
#      asu_roce_rnr_retry: 7
#      asu_roce_min_rnr_timer: 12
#      asu_roce_qp_rd_atom: 16
#      asu_roce_sq_depth: 256
#      asu_roce_rq_depth: 64
#      asu_roce_cq_depth: 512
#      asu_roce_inline_threshold: 0
#      asu_roce_qp_backend: "verbs"      # verbs | simulated
#      asu_roce_oob_role: "client"       # client connects, server listens
#      asu_roce_oob_bind_ip: "0.0.0.0"
#      asu_roce_oob_connect_timeout_ms: 3000
#      asu_roce_handshake_timeout_ms: 4000
