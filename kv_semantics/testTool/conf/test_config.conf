testmode = 1 # 输入文件类型。 1: input.txt不带value  2： input.txt带value
runtime = 10 # 运行时长。单位：秒。 >0 压测到达时间后退出； runtime=0 为循环模式，以loop为准。
loop = 1 # 请求循环执行次数。当runtime = 0 时生效，此时loop需要大于0。
perf = on # on: 压测模式。主日志级别仍取 log.level（不强制降级），请求明细日志关闭（readlogdir 下不写明细文件）。 off：输出全量日志与请求明细
onlyconnect = off # on: 只建链，不下IO  off: 建链、下IO
autodisconnect = 0 # 建链后自动断开时长（秒）。0: 禁用（缺省）  >0: 建链成功 n 秒后自动断开连接——断开后进程不退出，继续挂起等 Ctrl+C 供观察断链后状态（仅 onlyconnect = on 时生效；断开走优雅断链——先注销 region 再发送断链协议帧并销毁 QP，对端可感知）

startcoreid = 24 # 工具绑的起始核；worker i 绑 startcoreid+i（绑核失败仅告警不绑）
numjobs = 16 # 并发 worker 线程数；共享任务流（每任务仅执行一次），段内并发执行，sleep 段末全员同步停顿

buffersize = 1048576 # 值缓冲单块容量（字节）。建链时分配注册一次；须不小于 input 单条指令最大 length
buffercount = 256 # 值缓冲块数。建链时分配注册一次；须不小于单任务最大 entry 数（batch 条数）；多 worker 在飞任务共享本池，空闲块不足时阻塞等待
buffertype = cpu # 值缓冲内存类型（决定注册 MemoryType 与分配来源）。 cpu: 主机内存（HOST）  gpu: CUDA 显存（DEVICE，编入 TESTTOOL_ENABLE_CUDA 后真分配，否则主机内存模拟）  npu: ACL NPU 内存（DEVICE，编入 TESTTOOL_ENABLE_ASCEND 后真分配，否则主机内存模拟）
deviceid = 0 # 设备 ID（buffertype=gpu/npu 时使用：CUDA device / ACL device 编号）

# log 参数
readlogdir = log/get # 读log的位置
logdir = log/ # 日志输出目录
log.level = info # 全量日志最低级别：debug|info|warn|error
log.console = on # 全量日志是否同步打印到控制台：on 打印（缺省本键视为 on） off 仅落盘
log.pattern = [%Y-%m-%d %H:%M:%S.%e] [%l] [%t] %v # 日志输出格式（值不能含 '#'；语法同 spdlog pattern）
log.file_name = nds_%Y%m%d_%H.log # 全量日志文件名（%Y%m%d_%H 等时间标记按启动时刻展开）
log.warn_file_name = nds_warn_%Y%m%d_%H.log # warn 专用文件名（记录 warn 及以上）
log.error_file_name = nds_error_%Y%m%d_%H.log # error 专用文件名（记录 error 及以上）
log.max_file_size = 10485760 # 单文件大小上限（字节），写满滚动
log.max_files = 4 # 滚动文件保留个数（不含活跃文件；0 不清理）
log.async_queue_size = 8192 # 异步队列长度（满则阻塞）
log.async_flush_interval_ms = 100 # 周期刷盘间隔（毫秒）
