# Example kv-test + ASU client config for AICPUProvider using its current UBG mode.
# Format: key=value. Lines starting with # are ignored.
#
# Usage:
#   KV_TEST_CONFIG=./kv_semantics/kv_test/asu_kv_test_aicpu.conf kv-test config check
#   kv-test connect --configpath ./kv_semantics/kv_test/asu_kv_test_aicpu.conf
#
# The matching staged server should run kv_hash_staged_server with --conn-mode rm.
# feature_26h1 uses its fixed 1 query + 4 load + 2 store QP layout, so start the
# server with --jetties 7 and --max-accepts 0.

# ASU client identity and wait behavior.
client_id=kv-test-aicpu-client-0
default_wait_timeout_ms=30000

# Optional runtime library overrides. If omitted, kv-test tries
# KV_TEST_ASU_CLIENT_LIB/KV_TEST_ASU_TRANSPORT_LIB, dynamic linker search paths,
# and the default build-tree sibling directory.
# asu.client_library_path=/path/to/libkv_client.so
# asu.transport_library_path=/path/to/libkv_transport.so

# Relative paths in this file are resolved against the process working
# directory. The example below assumes kv-test is run from the repository root.
view.config_path=./kv_semantics/kv_test/asu_view_aicpu.conf

# Keep transport.asu_ids aligned with asuIds in asu_view_aicpu.conf.
hash_table.type=RING_HASH
ring_hash.virtual_node_count=128
transport.asu_ids=1
transport.provider_type=AICPU
transport.aicpu_hcomm_protocol=ubg

# Local HCOMM/UB endpoint settings. The provider first uses the caller's current
# ACL logical device. device_id is a temporary compatibility fallback for a
# process that has no current ACL device.
#
# Configure the UB EID for each ACL logical device. UBG requires EID endpoints;
# the provider does not perform IP-to-EID discovery.
transport.device_id=0
transport.aicpu_local_eid.0=eid:00112233445566778899aabbccddeeff
# transport.aicpu_local_eid.1=eid:<device-1-eid>
transport.timeout=30000

# Remote ASU endpoint. local.comm_id is the staged server's UBG EID and port is
# the RaSocket OOB listening port.
asu_info.1=protocol=UBG,local.comm_id=eid:ffeeddccbbaa99887766554433221100,port=19001

# For a single-device process, transport.aicpu_local_eid=<eid> may be used as a
# common fallback.
# To test the UBC_CTP path, set transport.aicpu_hcomm_protocol=ubc_ctp and
# configure transport.aicpu_local_ip.<logical_device_id>=<UB/IPoURMA address>.
# Also set protocol=UB and use the server UB/IPoURMA address in asu_info.1 in
# both this file and asu_view_aicpu.conf.
# AICPUProvider rejects all other HCOMM protocols.

# SQE fields whose configured values differ from protocol defaults.
transport.kv_ns_id=1
transport.sc=true

# AICPUProvider currently uses HcommChannelCreateStaged. Connection negotiation,
# server capability discovery, and MR publication remain on HCCP RaSocket while
# the data connection uses UBG.
# These are implementation details of AICPUProvider rather than a separate provider type.
# The OOB address and port default to local.comm_id and port from asu_info.1.

# Optional HIXL kernel JSON override. If unset, the provider uses
# HIXL_KERNEL_JSON or ASCEND_HOME_PATH plus the default CANN suffix.
# The installed kernel must provide the HixlBatchSend ABI from Hixl 20638ca.
# Staged Hcomm channels use USER_CTL sender CQs, so AICPUProvider requests
# complete_sender_cqe=1 and the paired Hcomm must export
# HcommA5UdmaCompleteSenderCqOnThread.
# transport.aicpu_hixl_kernel_json=/path/to/libcann_hixl_kernel.json

# kv-test data generation defaults. Keep count small for smoke tests.
kv.key_prefix=k
kv.seed=20260530
kv.value_size=4096
kv.count=1

# Operation limits used by kv-test validation.
limits.memory_max_bytes=4294967296

# Bench defaults. CLI flags can override these.
bench.io_size=4096
bench.concurrency=1
bench.duration_sec=10
bench.warmup_sec=1
bench.read_ratio=50
bench.write_ratio=50
bench.batch_size=1

# ResultWriter output directory.
output.path=./kv-test-output/aicpu
output.realtime_file_max_bytes=104857600
