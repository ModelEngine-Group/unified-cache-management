<text x="235" y="124" text-anchor="middle" font-size="12" fill="#791F1F">rewrite or delete the stale span in the transcript</text>
<text x="645" y="106" text-anchor="middle" font-size="14" class="w5" fill="#0F6E56">KV context edit — this proposal</text>
<text x="645" y="124" text-anchor="middle" font-size="12" fill="#085041">declare a hole; plaintext bytes unchanged</text>

<text x="60" y="160" font-size="11.5" fill="#5F5E5A">tokens</text>
<text x="470" y="160" font-size="11.5" fill="#5F5E5A">tokens</text>

