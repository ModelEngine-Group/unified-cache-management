name: Bug report
description: Raise an issue here if you find a bug.
title: "[Bug]: "
labels: ["bug", "status:triage"]

body:
- type: markdown
  attributes:
    value: >
      Search [existing issues](https://github.com/ModelEngine-Group/unified-cache-management/issues?q=is%3Aissue%20sort%3Acreated-desc) before submitting a report.
      For a version test bug, create this Issue under that version's Bug Archive.
      Its parent relationship identifies the source version during synchronization.
- type: textarea
  id: environment
  attributes:
    label: Your current environment
    description: |
      Include the operating system, hardware, inference engine and version,
      UCM version, backend, and relevant configuration.
    value: |
      <details>
      <summary>Environment details</summary>

      ```text
      Paste environment details here.
      ```
      
      </details>
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Describe the bug
    description: Describe the problem, its impact, and the conditions under which it occurs.
  validations:
    required: true
- type: input
  id: tested_commit_or_image
  attributes:
    label: Tested commit or image
    description: Include the commit, package version, or container image used when reproducing the bug.
- type: input
  id: requirement
  attributes:
    label: Related requirement
    description: Link the related requirement Issue when applicable.
- type: textarea
  id: reproduction_steps
  attributes:
    label: Reproduction steps
    description: Provide minimal steps, commands, configuration, and input needed to reproduce the problem.
  validations:
    required: true
- type: textarea
  id: expected_result
  attributes:
    label: Expected result
  validations:
    required: true
- type: textarea
  id: actual_result
  attributes:
    label: Actual result
    description: Include observed output and relevant logs or the full traceback.
  validations:
    required: true
- type: input
  id: frequency
  attributes:
    label: Frequency
    description: Describe how often the problem occurs.
