# kv client 配置（KvClientConfig::LoadFromFile 解析，仅支持整行注释）
# 相对路径相对进程工作目录，建议在 testTool 目录下运行

# 客户端标识与默认等待超时
client.client_id=testtool-client-0
wait_timeout_ms=5000

# 推理引擎键解析（string key 的命名空间字段解析方式；8 字节二进制 key 直通不解析）：
# generic（缺省）/ vllm_ascend / sglang，testTool 压测用缺省 generic 即可
#inference.engine=generic

# 单 key 请求走批量 IO 通路
client.use_batch_io_for_single_key=true

# 路由哈希表类型与环哈希虚拟节点数
client.hash_table.type=RING_HASH
client.ring_hash.virtual_node_count=128

# ASU 传输配置：FAKE provider（本地模拟收发，无需真实 ASU）
transport.asu_ids=1
transport.provider_type=FAKE
transport.device_id=0

# ASU 1 的端点（FAKE 下 TCP 为占位值，不产生真实网络 IO）
asu_info.1=protocol=TCP,local.comm_id=127.0.0.1,port=19001

# ---- CPU-over-RoCE provider 配置模板（真实建链时取消注释并按环境改值，FAKE 基线不受影响）----
# 启用三步：① transport.provider_type 改为 CPU；② asu_info.N 的 port 指向对端 KV store
# 监听端口；③ 取消注释并填写必填项 roce_gid_index，其余键缺省取默认值。
# 注意：本工具（kv client 侧）键名前缀为 transport.roce_*；对端 KV store 配置中的
# 同名键前缀为 asu_roce_*（两侧前缀不同、键主体一致，详见 kv_semantics/docs/guide/roce-provider.md）。
#transport.roce_qp_backend=verbs
#transport.roce_oob_role=client
#transport.roce_oob_bind_ip=
#transport.roce_oob_connect_timeout_ms=3000
#transport.roce_handshake_timeout_ms=5000
#transport.roce_hca_name=mlx5_0
#transport.roce_hca_port=1
#transport.roce_gid_index=3
#transport.roce_sq_depth=256
#transport.roce_rq_depth=64
#transport.roce_cq_depth=512
#transport.roce_inline_threshold=0
#transport.roce_sl=3
#transport.roce_traffic_class=104
#transport.roce_qp_timeout=17
#transport.roce_retry_cnt=7
#transport.roce_rnr_retry=7
#transport.roce_min_rnr_timer=12
#transport.roce_qp_rd_atom=16

# 视图配置文件（Init 时加载建链，后续刷新重读本文件）
view.config_path=conf/kv_client_view.conf
