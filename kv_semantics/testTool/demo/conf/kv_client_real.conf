# kv client 配置模板（真机建链验证用）——基于仓库 conf/kv_client.conf 复制修改。
# 注意：本文件仅支持整行注释（'#' 开头），不支持行内注释。
# 相对路径相对进程工作目录，建议在 testTool 目录下运行。

# 客户端标识与默认等待超时
client.client_id=testtool-real-0
wait_timeout_ms=5000

# 单 key 请求走批量 IO 通路
client.use_batch_io_for_single_key=true

# 路由哈希表类型与环哈希虚拟节点数
client.hash_table.type=RING_HASH
client.ring_hash.virtual_node_count=128

# ---- 以下按目标环境修改 ----
# transport.provider_type：FAKE 为本地模拟（无需真实 ASU）；真实传输改为 AIV 或 AICPU
# transport.asu_ids：ASU 节点编号列表，与下方 asu_info.N、view 文件三处保持一致
# transport.device_id：设备 ID（真机环境按实际设备编号）
transport.asu_ids=1
transport.provider_type=FAKE
transport.device_id=0

# ASU 1 的端点（与 kv_client_view_real.conf 保持一致；真实端点格式以目标环境为准）
asu_info.1=protocol=TCP,local.comm_id=127.0.0.1,port=19001

# 视图配置文件（Init 时加载建链，后续刷新重读本文件；相对进程工作目录）
view.config_path=demo/conf/kv_client_view_real.conf
