# ============================================================
# Qwen3-0.6B PD 分离 1P1D（CUDA / Mooncake + UCM MultiConnector）
# helm install qwen3-0p6b-1p1-1d1 -n inference --create-namespace . -f values.yaml -f models/cuda/values-qwen3-0p6b-1p1-1d1.yaml
# 渲染：Mooncake master(Service+Deployment) + ModelServing 2 role(prefill/decode) + ModelServer + ModelRoute
# KV：运行时按 role identity 生成 —— P0=engine 0/port 20001，D0=engine 1/port 20101；producer 自动叠加 UCM。
# Mooncake KV 走唯一 kv_port 基址（GPU 也一样），需 hostNetwork；反亲和进一步降低同机端口冲突风险。
# ============================================================
mooncakeMaster:
  enabled: true
  create: true
  client:
    config: |
      {
        "metadata_server": "P2PHANDSHAKE",
        "global_segment_size": "80GB",
        "local_buffer_size": "4GB",
        "protocol": "rdma",
        "device_name": ""
      }
  # master 不占 GPU 卡（纯 CPU 控制面）；nodeSelector 钉 GPU 节点（标签按集群实际，此处用 GFD 的 gpu.present）。
  resources:
    limits:   { rdma/rdma_shared: "1", cpu: "2", memory: 4Gi }
    requests: { rdma/rdma_shared: "1", cpu: "1", memory: 2Gi }
  nodeSelector:
    "nvidia.com/gpu.present": "true"

servingEngineSpec:
  enableEngine: true
  containerPort: 8000
  modelSpec:
    name: "qwen3-0p6b-1p1-1d1"                  # K8s 资源名片段：小写字母/数字/-，起止字母或数字；<release>-<name> <= 63
    modelPath: "/mnt/model/Qwen3-0.6B"
    modelName: "Qwen3-0.6B"
    shmSize: "128Gi"
    recoveryPolicy: ServingGroupRecreate          # 可选：ServingGroupRecreate（整组）| RoleRecreate（单 Role，默认）| None（Pod/Deployment 默认行为）
    restartGracePeriodSeconds: 60
    gangPolicy:
      minRoleReplicas:
        prefill: 1
        decode: 1
    # 无 runtime sidecar：router 直连引擎 8000、KV 走引擎自带连接器；如 kthena webhook 自动注入则由其托管。
    pd:
      kvTransfer:
        connector: MooncakeConnectorV1            # 可选（区分大小写）：MooncakeConnectorV1 | MooncakeHybridConnector | NixlConnector
        routerType: mooncake                       # Mooncake 两种 connector 对应 mooncake；NixlConnector 对应 nixl
        # ===== Chart 托管的 KV identity 输出 =====
        # - engine_id：从 engineIdBase 起，按 serving group、P/D role 与副本序号生成。
        # - kv_port：从 kvPortBase 起按 instanceStride 分配，与 containerPort/HTTP --port 无关。
        # 最终值由 Chart 写入运行时 KV 配置，不要手工覆盖。
        identity:
          engineIdBase: 0                         # 首个逻辑 P/D 实例的 engine_id
          kvPortBase: 20001                       # 首个逻辑 P/D 实例的 Mooncake kv_port
          instanceStride: 100                     # 相邻实例的端口基址间隔，须覆盖单实例并行端口跨度
      mooncake:
        master:
          enabled: true
      antiAffinity: true
      prefill: prefill
      decode: decode
    router:
      enabled: true
      inferenceEngine: vLLM
      trafficPolicy:
        timeout: 60s
    hooks:
      preStart: |
        echo "[hook] preStart: pod=${POD_NAME} kind=${UC_POD_KIND:-entry} master=${MASTER_IP} rank=${NODE_RANK}"
        export UC_PRESTART_MARK="${POD_NAME}"
      postReady: |
        echo "[hook] postReady: ${POD_IP}:${POD_PORT} is serving"
      preStop: |
        echo "[hook] preStop: pod=${POD_NAME} is stopping"
    # ===== Chart 托管的 vLLM 启动参数（下方所有 role 共用）=====
    # vllmArgs 仅填写模型、并行与性能参数；下列参数由 Chart 拼接或保留，重复填写会渲染失败：
    # - modelPath：vllm serve 的模型路径位置参数，来自 modelSpec.modelPath。
    # - --served-model-name：对外模型名，来自 modelSpec.modelName（为空时回退 modelPath）。
    # - --host：entry 监听地址，固定为 0.0.0.0。
    # - --port：entry HTTP 服务端口，来自 containerPort。
    # - --headless：worker 启动模式。
    # - --data-parallel-address (-dpa)：多机时使用 MASTER_IP。
    # - --data-parallel-rpc-port (-dpp)：多机时使用 Chart 计算的 DP RPC 端口。
    # - --data-parallel-start-rank (-dpr)：多机时按 NODE_RANK 与本地 DP size 计算。
    # - --kv-transfer-config：启用 UCM/PD 时由 Chart 生成并在 Pod 启动期解析。
    # - --config：始终禁止，避免外部配置绕过托管参数校验。
    # - --kv-offloading-size：存在 Chart KV 配置时禁止。
    # - --kv-offloading-backend：存在 Chart KV 配置时禁止。
    # Connector 结果：
    # - UCMConnector(kv_both)：UCM-only role 使用。
    # - MultiConnector：PD+UCM 的 prefill 使用，内部组合传输 connector 与 UCMConnector。
    # - 传输 connector：PD 的 decode 单独使用。
    roles:
      - name: prefill                         # role 名：小写字母/数字/-，起止字母或数字，最长 12
        replicas: 1                               # xPyD 的 x
        workerReplicas: 0
        resources:
          limits:   { nvidia.com/gpu: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
          requests: { nvidia.com/gpu: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
        vllmArgs: |
          --tensor-parallel-size 1
          --max-model-len 20000
          --block-size 128
          --gpu-memory-utilization 0.85
          --trust-remote-code
      - name: decode                         # role 名：小写字母/数字/-，起止字母或数字，最长 12
        replicas: 1                               # xPyD 的 y
        workerReplicas: 0
        resources:
          limits:   { nvidia.com/gpu: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
          requests: { nvidia.com/gpu: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
        vllmArgs: |
          --tensor-parallel-size 1
          --max-model-len 20000
          --block-size 128
          --gpu-memory-utilization 0.85
          --trust-remote-code
          --no-enable-prefix-caching
    # ===== Chart 托管的运行时环境变量（勿在 env 中设置）=====
    # - UC_PD_GROUP_NAME：当前逻辑 serving group 名称。
    # - UC_PD_ROLE_ID：当前 role 副本序号。
    # - UC_USES_UCM：当前 role 是否挂载并使用 UCM。
    # - VLLM_ARGS_FILE：当前 role 投影的 vllm.args 文件路径。
    # - MOONCAKE_MASTER：启用 Mooncake master 时注入其 RPC 地址。
    # - MOONCAKE_CONFIG_PATH：启用 Mooncake master 时固定为客户端配置文件路径。
    # - MOONCAKE_GLOBAL_SEGMENT_SIZE：启用 Mooncake master 时来自 client.config.global_segment_size。
    env:
      - { name: VLLM_SERVER_DEV_MODE, value: "1" }
      - { name: RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES, value: "1" }
      - { name: VLLM_ALLREDUCE_USE_SYMM_MEM, value: "0" }
      - { name: VLLM_USE_DEEP_GEMM, value: "0" }
      # Mooncake 的 RDMA NIC 配置取决于集群网络，不在 profile 中硬编码网卡名。
      # 若 GPU 集群需显式 RDMA/控制面网卡，按节点实测取消注释填写：
      #   - { name: NCCL_IB_HCA, value: "<mlx5_x>" }        # RDMA HCA，集群相关
      #   - { name: GLOO_SOCKET_IFNAME, value: "<ethN>" }   # 控制面网卡，集群相关
      # Mooncake/UCM 传输参数来自 kvTransfer 模板、运行时 identity resolver 与 unifiedcacheConfig，不走 env。
    # ===== Unified Cache 托管参数（本模型）=====
    # unifiedcacheConfig.config 作为 UCM 原生配置透传；完整字段说明见根 values.yaml。
    # - storage_backends：Chart 按 unifiedcacheStorage 的 mountPath 顺序生成。
    # - UCM_CONFIG_FILE：固定指向 /vllm-workspace/UnifiedCache/config/ucm_config.runtime.yaml。
    unifiedcacheConfig:
      enabled: true                         # false = 不使用 UCM（不注 UCMConnector、不渲染 ucm ConfigMap、不挂缓存盘）
      config:
        ucm_connectors:
          - ucm_connector_name: "UcmPipelineStore"
            ucm_connector_config:
              io_direct: false
              store_pipeline: "Cache|Posix"
              cache_buffer_capacity_gb: 64
              use_gdr: false
    storage:
      # 每项从 dynamicPVC、staticPVC、persistentVolumeClaim、hostPath、csi、nfs 中选择一种来源。
      # 当前示例使用集群默认 StorageClass；其它来源和 extraStorage 写法见根 values.yaml。
      # 模型目录不绑定特定集群存储；部署时用额外 values 将 PVC、CSI 或 NFS 挂载到 /mnt/model。
      extraStorage: []
      unifiedcacheStorage:
        - name: model-data                    # Volume/PVC 名片段：小写字母/数字/-，起止字母或数字
          mountPath: /mnt/data
          dynamicPVC:
            pvcStorage: "1Ti"
            # 必填：替换为目标集群中支持 RWX 的 StorageClass 名称。
            storageClass: replace-with-your-rwx-storage-class
            pvcAccessMode: [ "ReadWriteMany" ]

        # 如需多个缓存后端，继续添加条目；storage_backends 按 mountPath 顺序生成。
