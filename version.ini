# Tag examples:
#   Stable:     v0.8.0
#   Prerelease: v0.8.0rc3
#   Draft:      draft/v0.8.0-1
#   Nightly:    nightly/v0.8.0-20260919-1 (adjust the date and daily sequence)
# Commit the code to package, then create and push a tag. Draft example:
#   git tag draft/v0.8.0-1
#   git push origin draft/v0.8.0-1
# Pushing the tag triggers packaging; Draft releases remain drafts.
# The base version (0.8.0 here) must match UCM_VERSION below. Never reuse a tag.
# Packaging runs in the repository that origin points to.
# vLLM 0.29 changed the KVCache layout, which is incompatible with the layout
# used by earlier vLLM/vllm-ascend releases. develop and 0.9.0rc2 therefore
# support vLLM/vllm-ascend 0.30 and newer only; earlier releases stay on 0.8.x.
UCM_VERSION=0.9.0
# UCM_SUPPORTED_VLLM_VERSIONS 用法（下方 Ascend、SGLang 变量遵循相同规则）：
#   0.30             自动选择 0.30 范围内的版本及其合法变体。
#   0.30.0           只在 0.30.0 范围内选择版本及其合法变体。
#   @v0.30.0         只选择已配置上游仓库中的这个 Tag，不扩展其他 Tag。
#   0.30,@v0.31.0    用逗号组合范围与固定 Tag，不要加空格或重复选择。
# 自动选择优先 stable，其次 rc；Ascend 还允许 nightly 回退。
# @ 后只写实际已发布且符合该框架命名规则的 Tag，不写镜像地址或 digest。
# 旧写法 0.30@v0.30.0 已停用，请改为 @v0.30.0。
# 删除、注释掉变量，或写成 UCM_SUPPORTED_VLLM_VERSIONS=，均关闭 vLLM 自动构建。
# 至少保留一个框架的有效配置；UCM_VERSION 始终必填。
# 关闭某框架后，其他框架仍需要的共享 Wheel/Builder 会继续构建。
UCM_SUPPORTED_VLLM_VERSIONS=0.30,0.31
UCM_SUPPORTED_VLLM_ASCEND_VERSIONS=0.30
UCM_SUPPORTED_SGLANG_VERSIONS=0.5.18,0.5.19,0.5.20
