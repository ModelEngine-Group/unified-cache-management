name: 'Pull Request Gate'

on:
  pull_request:
    branches: [ "dev*", "main", "*release", "feature*", "feature/**" ]
    # Marking a draft ready must re-run the Gate so the full jobs execute before
    # merge. Path filtering is intentionally NOT used at the workflow level: a
    # skipped workflow leaves required checks Pending and blocks merges. Skipping
    # irrelevant work is done per job via `if:` instead.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      native_wheel_required: ${{ steps.build-impact.outputs.required }}
      code_changed: ${{ steps.build-impact.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: fetch_base_and_pr_branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch origin "${BASE_REF}"

          if [ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]; then
            echo "PR is from a fork, adding remote."
            git remote add fork "${HEAD_CLONE_URL}"
            git fetch fork "${HEAD_REF}"
            HEAD_BRANCH_NAME="fork/${HEAD_REF}"
            echo "HEAD_BRANCH_NAME=${HEAD_BRANCH_NAME}" >>"${GITHUB_OUTPUT}"
          else
            git fetch origin "${HEAD_REF}"
            HEAD_BRANCH_NAME="origin/${HEAD_REF}"
            echo "HEAD_BRANCH_NAME=${HEAD_BRANCH_NAME}" >>"${GITHUB_OUTPUT}"
          fi

      # PR branch names are author-controlled: keep them in quoted env values.
      - id: uptodate-check
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH_NAME: ${{ steps.fetch_base_and_pr_branches.outputs.HEAD_BRANCH_NAME }}
        run: |

          if git merge-base --is-ancestor "origin/${BASE_REF}" "${HEAD_BRANCH_NAME}"; then
            echo "PR branch is up-to-date with target branch, continue workflow."
          else
            echo "::error::PR branch is OUT-OF-DATE with target branch, stop workflow, please update your branch and try again."
            exit 1
          fi

      - id: build-impact
        name: Detect native Wheel build inputs and code changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH_NAME: ${{ steps.fetch_base_and_pr_branches.outputs.HEAD_BRANCH_NAME }}
        run: |
          set -euo pipefail
          native_required=false
          code_changed=false
          while IFS= read -r path; do
            case "${path}" in
              CMakeLists.txt|cmake/*|ucm/*|setup.py|pyproject.toml|MANIFEST.in|version.ini|ucm_patch.pth|README.md|LICENSE|scripts/materialize_version.py|.github/release/ucm_release/*|.github/release/docker/*|.github/release/requirements/*|.github/release/requirements*.txt|.github/release/check-builder-cann.py|.github/release/install-validate-wheel-runtime.sh|requirements-build.txt|.github/release/release.yaml|.github/release/platforms.yaml|.github/actions/download-artifact-retry/*|.github/actions/setup-crane/*|.github/workflows/_build-wheel.yml|.github/workflows/_probe-runtime.yml|.github/workflows/_native-wheel-gate.yml|.github/workflows/release-ucm.yml|.github/workflows/pull-request.yml)
                native_required=true
                ;;
            esac
            # `*.md` already covers CODE_OF_CONDUCT.md and the PR template.
            case "${path}" in
              docs/*|docs-next/*|*.md|LICENSE|.gitignore|.gitattributes|.editorconfig|.readthedocs.yaml|.github/CODEOWNERS|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                code_changed=true
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...${HEAD_BRANCH_NAME}")
          {
            echo "required=${native_required}"
            echo "code_changed=${code_changed}"
          } >>"${GITHUB_OUTPUT}"

  lint-and-unit-tests:
    needs: pre-check
    if: needs.pre-check.outputs.code_changed == 'true'
    uses: ./.github/workflows/lint-and-test.yml

  native-wheel-build:
    name: Native Wheel Matrix
    needs: pre-check
    if: >-
      needs.pre-check.outputs.native_wheel_required == 'true' &&
      github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_native-wheel-gate.yml
    with:
      source_ref: ${{ github.sha }}
      retention_days: 7

  native-wheel-compile:
    name: native-wheel-compile
    needs: [pre-check, native-wheel-build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the applicable native Wheel build
        env:
          PRE_CHECK_RESULT: ${{ needs.pre-check.result }}
          BUILD_REQUIRED: ${{ needs.pre-check.outputs.native_wheel_required }}
          BUILD_RESULT: ${{ needs.native-wheel-build.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "${PRE_CHECK_RESULT}" != success ]; then
            echo "Native Wheel Gate cannot pass because pre-check did not succeed" >&2
            exit 1
          fi
          if [ "${DRAFT}" = true ]; then
            echo "Draft PR: the native Wheel build is deferred until ready for review"
            exit 0
          fi
          if [ "${BUILD_REQUIRED}" != true ]; then
            echo "Native Wheel Gate is not required for this PR"
            exit 0
          fi
          if [ "${BUILD_RESULT}" != success ]; then
            echo "Native Wheel Gate failed: ${BUILD_RESULT}" >&2
            exit 1
          fi
          echo "All planned native Wheels compiled successfully"

  test-e2e-sglang-a2:
    timeout-minutes: 30
    runs-on: [self-hosted, npu, a2]
    needs: [lint-and-unit-tests, test-e2e-pc-a2]
    if: >-
      ${{
        always() &&
        needs.lint-and-unit-tests.result == 'success' &&
        github.repository == 'ModelEngine-Group/unified-cache-management' &&
        github.event.pull_request.draft == false
      }}
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Clean repo
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            cd ${{ github.workspace }}
            rm -rf ./*
            rm -rf .[!.]*
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Install Docker CLI
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo &> /dev/null; then
              SUDO="sudo"
            else
              echo "Docker CLI installation requires root or sudo"
              exit 1
            fi
          fi
          if ! command -v docker &> /dev/null; then
            ${SUDO} apt-get update
            ${SUDO} apt-get install -y docker.io
          fi
          if ! ${SUDO} docker info >/dev/null 2>&1; then
            echo "Docker daemon is not reachable from the runner."
            exit 1
          fi

      - name: Generate Docker Image Version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          REF_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          VERSION="${REF_NAME}-${DATE}-${{ github.run_number }}-${SHORT_SHA}"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Build
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          cd ${{ github.workspace }}
          ${SUDO} docker build \
            --build-arg http_proxy="${http_proxy:-}" \
            --build-arg https_proxy="${https_proxy:-}" \
            --build-arg no_proxy="repo.huaweicloud.com,${no_proxy:-}" \
            --build-arg PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple \
            -t ucm-e2etest-sglang-a2:${{ steps.version.outputs.version }} \
            -f ./docker/Dockerfile.ucm-sglang-ascend.a2-v0.5.18 ./

      - name: Test SGLang Online Inference in Docker
        run: |
          RESULT_DIR="${{ github.workspace }}/test_results"
          RESULT_FILE="${{ steps.version.outputs.version }}-sglang-online.xml"
          CONTAINER_NAME="ucm-e2etest-sglang-a2-${{ steps.version.outputs.version }}"
          MODEL_DIR="${A2_E2E_MODEL_DIR:-/home/huangmy/models}"
          MODEL_NAME="${SGLANG_E2E_MODEL_NAME:-Qwen3-0.6B}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          mkdir -p "${RESULT_DIR}"
          rm -f "${RESULT_DIR}/${RESULT_FILE}"
          ${SUDO} docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          A2_E2E_HOST_DEVICE="${A2_E2E_HOST_DEVICE:-/dev/vdavinci212}"
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "Using Ascend host device: ${A2_E2E_HOST_DEVICE}"
          echo "=== Host Ascend device nodes ==="
          ls -l "${A2_E2E_HOST_DEVICE}" /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc || true
          if command -v npu-smi >/dev/null 2>&1; then
            echo "=== Host NPU status ==="
            npu-smi info || true
          fi
          set +e
          ${SUDO} docker run --name "${CONTAINER_NAME}" \
            --privileged \
            --network=host \
            --ipc=host \
            --shm-size=32g \
            --device "${A2_E2E_HOST_DEVICE}:/dev/davinci0" \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/sbin:/usr/local/sbin:ro \
            -v /usr/local/dcmi:/usr/local/dcmi:ro \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /usr/local/Ascend/firmware:/usr/local/Ascend/firmware:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            -v "${MODEL_DIR}:/home/models:ro" \
            -e http_proxy="${http_proxy:-}" \
            -e https_proxy="${https_proxy:-}" \
            -e no_proxy="${no_proxy:-}" \
            -e SGLANG_E2E_MODEL_PATH="/home/models/${MODEL_NAME}" \
            --entrypoint /bin/bash \
            ucm-e2etest-sglang-a2:${{ steps.version.outputs.version }} \
            -lc "set -e; echo '=== Ascend device nodes ==='; ls -l /dev/davinci0 /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc; echo '=== Ascend driver ==='; cat /usr/local/Ascend/driver/version.info || true; echo '=== NPU status ==='; npu-smi info; echo '=== torch_npu probe ==='; python3 -c 'import torch, torch_npu; print(\"torch:\", torch.__version__); print(\"torch_npu:\", torch_npu.__version__); print(\"device_count:\", torch_npu.npu.device_count()); print(\"is_available:\", torch_npu.npu.is_available()); assert torch_npu.npu.is_available(), \"Ascend NPU is unavailable inside the SGLang container\"'; mkdir -p /workspace/test_results; cd /workspace/unified-cache-management/test; pip install -r requirements.txt; python3 -m pytest -x --stage=1 --feature=sglang_online_inference --platform=npu -k 'test_sglang_online_accuracy_from_persisted_cache_a2' --junitxml=/workspace/test_results/${RESULT_FILE}"
          TEST_RC=$?
          ${SUDO} docker cp "${CONTAINER_NAME}:/workspace/test_results/${RESULT_FILE}" "${RESULT_DIR}/${RESULT_FILE}" >/dev/null 2>&1 || true
          ${SUDO} docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          exit "${TEST_RC}"

      - name: Cleanup Docker Image
        if: ${{ always() && steps.version.outputs.version != '' }}
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          ${SUDO} docker rm -f "ucm-e2etest-sglang-a2-${{ steps.version.outputs.version }}" >/dev/null 2>&1 || true
          ${SUDO} docker rmi ucm-e2etest-sglang-a2:${{ steps.version.outputs.version }} || true

      - name: Cleanup Test Results
        if: ${{ always() && steps.version.outputs.version != '' }}
        run: |
          rm -f "${{ github.workspace }}/test_results/${{ steps.version.outputs.version }}-sglang-online.xml" || true

  test-e2e-pc-a2:
    timeout-minutes: 20
    runs-on: [self-hosted, npu, a2]
    needs: lint-and-unit-tests
    if: >-
      github.repository == 'ModelEngine-Group/unified-cache-management' &&
      github.event.pull_request.draft == false
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Clean repo
        run: |
          if [ -d "${{ github.workspace }}" ]; then
            cd ${{ github.workspace }}
            rm -rf ./*
            rm -rf .[!.]*
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Install Docker CLI
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo &> /dev/null; then
              SUDO="sudo"
            else
              echo "Docker CLI installation requires root or sudo"
              exit 1
            fi
          fi
          if ! command -v docker &> /dev/null; then
            echo "Docker CLI not found, installing..."
            ${SUDO} apt-get update
            ${SUDO} apt-get install -y docker.io
          else
            echo "Docker CLI already installed"
          fi
          if ! ${SUDO} docker info >/dev/null 2>&1; then
            echo "Docker daemon is not reachable from the runner."
            echo "Mount /var/run/docker.sock into the runner container so this job can build and run test images on the host Docker daemon."
            exit 1
          fi

      - name: Generate Docker Image Version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          REF_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          VERSION="${REF_NAME}-${DATE}-${{ github.run_number }}-${SHORT_SHA}"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "Docker image version: ${VERSION}"

      - name: Build
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          cd ${{ github.workspace }}
          ${SUDO} docker build \
            --build-arg http_proxy="${http_proxy:-}" \
            --build-arg https_proxy="${https_proxy:-}" \
            --build-arg no_proxy="repo.huaweicloud.com,${no_proxy:-}" \
            --build-arg PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple \
            -t ucm-e2etest-pc-a2:${{ steps.version.outputs.version }} \
            -f ./docker/Dockerfile.ucm-vllm-ascend.a2-v0.18.0 ./

      - name: Test E2E Online Inference in Docker
        run: |
          RESULT_DIR="${{ github.workspace }}/test_results"
          RESULT_FILE="${{ steps.version.outputs.version }}-online-inference.xml"
          CONTAINER_NAME="ucm-e2etest-pc-a2-${{ steps.version.outputs.version }}"
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          A2_E2E_HOST_DEVICE="${A2_E2E_HOST_DEVICE:-/dev/vdavinci212}"
          echo "Using Ascend host device: ${A2_E2E_HOST_DEVICE}"
          mkdir -p "${RESULT_DIR}"
          rm -f "${RESULT_DIR}/${RESULT_FILE}"
          ${SUDO} docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          set +e
          ${SUDO} docker run --name "${CONTAINER_NAME}" \
            --ipc=host \
            --device "${A2_E2E_HOST_DEVICE}:/dev/davinci0" \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /home/huangmy/models:/home/models:ro \
            -e http_proxy="${http_proxy:-}" \
            -e https_proxy="${https_proxy:-}" \
            -e no_proxy="${no_proxy:-}" \
            --entrypoint /bin/bash \
            ucm-e2etest-pc-a2:${{ steps.version.outputs.version }} \
            -lc "mkdir -p /workspace/test_results && cd /workspace/unified-cache-management/test && pip install -r requirements.txt && python3 -m pytest -x --stage=1 --feature=online_inference --platform=npu -k 'test_online_accuracy_hbm_ssd_mixed_a2_pc' --junitxml=/workspace/test_results/${RESULT_FILE}"
          TEST_RC=$?
          ${SUDO} docker cp "${CONTAINER_NAME}:/workspace/test_results/${RESULT_FILE}" "${RESULT_DIR}/${RESULT_FILE}" >/dev/null 2>&1 || true
          ${SUDO} docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          exit "${TEST_RC}"

      - name: Cleanup Docker Image
        if: ${{ always() && steps.version.outputs.version != '' }}
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo &> /dev/null; then
            SUDO="sudo"
          fi
          ${SUDO} docker rm -f "ucm-e2etest-pc-a2-${{ steps.version.outputs.version }}" >/dev/null 2>&1 || true
          ${SUDO} docker rmi ucm-e2etest-pc-a2:${{ steps.version.outputs.version }} || true

      - name: Cleanup Test Results
        if: ${{ always() && steps.version.outputs.version != '' }}
        run: |
          rm -f "${{ github.workspace }}/test_results/${{ steps.version.outputs.version }}-online-inference.xml" || true
