name: Cleanup one UCM Tag Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Stable, Prerelease, Draft, or Nightly Tag
        type: string
        required: true
      fail_resource:
        description: Optional exact resource for three synthetic HTTP 503 attempts
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ startsWith(inputs.tag, 'nightly/') && format('ucm-nightly-{0}', github.repository_id) || format('ucm-release-cleanup-{0}-{1}', github.repository_id, inputs.tag) }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup · ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.repository == 'ModelEngine-Group/unified-cache-management' && 'release-production' || 'fork-preview' }}
    permissions:
      actions: write
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CLEANUP_TAG: ${{ inputs.tag }}
      FAIL_RESOURCE: ${{ inputs.fail_resource }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record the cleanup implementation
        run: |
          mkdir -p out/cleanup
          git rev-parse HEAD >out/cleanup/implementation-sha.txt
          sha256sum .github/release/ucm_release/cleanup{,_records,_inventory,_remote}.py \
            >out/cleanup/implementation-files.sha256
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - name: Install Crane
        uses: ./.github/actions/setup-crane
      - name: Validate Docker Hub credentials when configured
        if: ${{ env.DOCKERHUB_USERNAME != '' || env.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          test -n "${DOCKERHUB_USERNAME}" && test -n "${DOCKERHUB_TOKEN}"
      - name: Authenticate to DockerHub when configured
        if: >-
          ${{
            env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
          }}
        run: |
          set -euo pipefail
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io \
            --username "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Delete manifest resources in recovery-preserving phases
        run: |
          set -euo pipefail
          test "${GH_REPO}" = "${GITHUB_REPOSITORY}"
          args=(tag --repository "${GH_REPO}" --tag "${CLEANUP_TAG}"
                --report out/cleanup/report.json)
          if [ -n "${FAIL_RESOURCE}" ]; then
            args+=(--fail-resource "${FAIL_RESOURCE}")
          fi
          python .github/release/ucm_release/cleanup.py "${args[@]}" \
            2>&1 | tee out/cleanup/cleanup.log
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: ucm-tag-cleanup-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/cleanup/
          if-no-files-found: warn
          retention-days: 90
