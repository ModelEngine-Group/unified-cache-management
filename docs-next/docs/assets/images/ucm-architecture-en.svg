<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 992" width="1120" height="992" role="img" aria-labelledby="ucm-architecture-en-title ucm-architecture-en-desc">
  <title id="ucm-architecture-en-title">UCM Connectors and Storage</title>
  <desc id="ucm-architecture-en-desc">Five connectors extend vLLM KVConnectorBase_V1. UC Connector and the planned UC Connector2 use UcmKVStoreBase, with seven Store implementations connected to storage resources. Non-sparse KV cache manager classes remain on the left.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #233c40; }
      .title { font-size: 28px; font-weight: 600; }
      .zone-label { font-size: 20px; font-weight: 600; }
      .section-label { font-size: 16px; fill: #657b7e; }
      .name { font-size: 20px; font-weight: 500; }
      .interface-name { font-size: 24px; font-weight: 600; }
      .store-name { font-size: 28px; font-weight: 600; fill: #fff; }
      .store-caption { font-size: 16px; fill: #d4ebe6; }
      .legend { font-size: 16px; fill: #526b70; }
      .software-zone { fill: #f8faf9; stroke: #dbe5e2; stroke-width: 1.2; }
      .resource-zone { fill: #f5f9fb; stroke: #dbe6ec; stroke-width: 1.2; }
      .vllm { fill: #edf0f2; stroke: #aebcc0; stroke-width: 1.2; }
      .ucm { fill: #e7f3ec; stroke: #76a28d; stroke-width: 1.2; }
      .planned { fill: #f5faf6; stroke: #76a28d; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .connector-focus { fill: #d7eee3; stroke: #008775; stroke-width: 2; }
      .store-focus { fill: #087c6c; stroke: #087c6c; stroke-width: 1.6; }
      .resource { fill: #eaf2f7; stroke: #8daab9; stroke-width: 1.2; }
      .inherit { fill: none; stroke: #7b9192; stroke-width: 1.4; }
      .call { fill: none; stroke: #248b79; stroke-width: 1.6; stroke-dasharray: 6 5; }
      .io { fill: none; stroke: #557e94; stroke-width: 1.6; }
    </style>
    <marker id="inheritance" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#fff" stroke="#7b9192" stroke-width="1.2"/></marker>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7b9192"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#248b79"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#557e94"/></marker>
  </defs>
  <rect width="1120" height="992" fill="#fff"/>
