# Release tag examples (the base version must match UCM_VERSION below):
#   Stable:     v0.9.0
#   Prerelease: v0.9.0rc3
#   Draft:      draft/v0.9.0-1
#   Nightly:    nightly/v0.9.0-20261028-1 (adjust the date and daily sequence)
# Commit the code to package, then create and push a new tag. Draft example:
#   git tag draft/v0.9.0-1
#   git push origin draft/v0.9.0-1
# Pushing the tag triggers packaging in the repository that origin points to.
# Draft releases remain drafts. Never reuse an existing tag.
#
# vLLM 0.29 changed the KV Cache layout, which is incompatible with earlier
# vLLM/vllm-ascend releases. develop and UCM 0.9.0rc2 support version 0.30 and
# newer only; use UCM 0.8.x for earlier runtime versions.
#
# UCM_SUPPORTED_VLLM_VERSIONS usage (the Ascend and SGLang keys work the same way):
#   0.30             Select a version within 0.30 and expand its legal variants.
#   0.30.0           Restrict automatic selection to the 0.30.0 patch range.
#   @v0.30.0         Select only this tag from the configured upstream repository.
#   0.30,@v0.31.0    Combine ranges and fixed tags with commas, without spaces.
# Automatic selection prefers stable, then RC; Ascend also allows nightly fallback.
# After @, write a published tag matching the product grammar, not an image URL
# or digest. The old 0.30@v0.30.0 syntax is rejected; use @v0.30.0 instead.
# Omit or comment out a key, or set it empty, to disable that product's builds:
#   UCM_SUPPORTED_VLLM_VERSIONS=
# UCM_VERSION is required, and at least one runtime product must remain enabled.
# Shared Wheels and Builders needed by other enabled products are still built.
# Overlapping ranges, duplicate tags, or ranges and pins selecting the same tag
# are errors. Fixed tags do not expand to other tags.

UCM_VERSION=0.9.0
UCM_SUPPORTED_VLLM_VERSIONS=0.30,0.31
UCM_SUPPORTED_VLLM_ASCEND_VERSIONS=0.30
UCM_SUPPORTED_SGLANG_VERSIONS=0.5.18,0.5.19,0.5.20
