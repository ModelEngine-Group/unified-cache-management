<rect x="40" y="402" width="800" height="48" rx="10" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="440" y="421" text-anchor="middle" font-size="12.5" class="w5" fill="#0F6E56">what the agent saved: the HBM footprint of tool₂, the load bandwidth of tool₂, and every future attention read of tool₂ —</text>
<text x="440" y="440" text-anchor="middle" font-size="12.5" class="w5" fill="#0F6E56">while every other block of the session hit exactly as before</text>
</svg>
