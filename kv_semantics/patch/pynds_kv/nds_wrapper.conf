# NDS wrapper configuration
# 与 nds_config.conf 同目录，启动时自动读取
# read/write request size 单位：MB（支持小数，如 2.875）；batch size 单位：KB（整数）；
# value_size 单位：MB（支持小数）或 KB（整数，用 value_size_kb 键，按 KB 精确指定）；
# addr 数量无单位；线程数为个
# 注意：value_size 必须与盘框 KV 池 valueSize 严格一致；非法取值会报错并保留默认值，不会被静默截断。
# 写 length > value_size 直接报错并给出建议配置值；写 length < value_size 时自动扩范围
# 写满 value_size（slot 写满，is_exists 才能命中），触发补齐只在 debug 模式
# （NDS_WRAP_DEBUG=1）打印；读路径按请求长度读取，尾 pair 可按 read_batch 向上对齐
# 单个 nsid 的 valueSize 与全局不同时，用 value_size_kb_nsid<N>（KB，N 为十进制 nsid）覆盖

read_req_size_mb=32
write_req_size_mb=32
read_batch_size_kb=128
write_batch_size_kb=128
value_size_mb=32
# 按 nsid 覆盖 valueSize（KB，整数）：不同 namespace 的 valueSize 不同时使用，
# 仅对对应 nsid 生效，优先级高于 value_size_mb / value_size_kb
# value_size_kb_nsid2 = 660  # per-nsid valueSize override (KB), for nsid 2
max_exist_addr_num=256

# 单个 NDS_REQ 的 addr_pair 物理上限（无符号整数，默认 4096，拒绝 0）：
# 对应 nds_wrapper.cpp 内最小 ABI 声明的 MAX_ADDR_NUM_IPC。conf 只能调低，
# 不能超过定长数组容量；req_size/batch_size 超过上限时 wrapper 会 clamp 并拆成
# 更多 REQ，同时在 init 时打 WARNING，建议直接调 req_size_mb / batch_size_kb。
# 厂商 SDK 数组布局变化时必须同步 ABI 声明并干净重编，不能只改 conf。
max_addr_num_per_req=4096

# key 打散开关：1=开启（默认），0=关闭。
# 开启后 wrapper 对整个 80-bit key（key_low 64 位 + key_high 16 位，含 worker_id
# 所在的高 16 位）做 xxhash 打散再下发，消除盘框按 key 特定位分盘/分链时的倾斜
#（如高 8/16 位只有 tp_rank 几个取值时只落少数盘），读写查经同一变换语义一致。
# 注意：切换该开关等于更换 key 空间，盘上旧数据全部失效，切换前需清盘或换 nsid。
key_scatter=1

# wrapper [ERROR] 打印开关：1=开启（默认），0=关闭。
# 断链/重连窗口内 SDK 对每个失败 REQ 打多条 ERROR 会刷屏淹没有效日志；
# 关闭后失败事实仍由上层（LMCache adapter 的 ret!=0 日志）体现，排障时改回 1。
error_print=1

# 每线程滑动窗口大小（无符号整数，默认 8，拒绝 0）：submitAsyncAndWait 先批量提交
# win 个 REQ 填充 RDMA 流水线，再逐个 wait 最老的 + submit 下一个，每线程同时 win 个
# REQ 在飞（8 线程 × 8 = 64 并发）。旧信号量方案因每线程 submit→wait 严格串行，
# 每线程最多 1 个在飞，RDMA QP 空闲。调参：从 8 起步，带宽不够加到 16。
max_inflight_reqs=8
# get_threads / put_threads / put_core_start 已废弃：改为滑动窗口模型
#（max_inflight_reqs），旧 conf 含这些键时静默忽略
