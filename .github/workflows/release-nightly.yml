name: UCM Nightly Release · Shanghai 02:00

on:
  schedule:
    # GitHub cron 使用 UTC；18:00 UTC 是上海次日 02:00。
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ucm-nightly-${{ github.repository_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-nightly:
    name: Select or create immutable Nightly Tag
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      git_tag: ${{ steps.prepare.outputs.git_tag }}
      release_type: ${{ steps.prepare.outputs.release_type }}
      release_kind: ${{ steps.prepare.outputs.release_kind }}
      version: ${{ steps.prepare.outputs.version }}
      chart_version: ${{ steps.prepare.outputs.chart_version }}
      image_version: ${{ steps.prepare.outputs.image_version }}
      is_prerelease: ${{ steps.prepare.outputs.is_prerelease }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: packaging==24.2
      - id: prepare
        name: Reuse an incomplete same-SHA Tag or create the next sequence
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          shanghai_date="$(TZ=Asia/Shanghai date +%Y%m%d)"
          tags_file="${RUNNER_TEMP}/ucm-tags.txt"
          git tag --list >"${tags_file}"
          next="$(python scripts/materialize_version.py --next-nightly \
            --tags-file "${tags_file}" --date "${shanghai_date}")"
          next_tag="$(jq -r '.git_tag' <<<"${next}")"
          prefix="${next_tag%-*}-"
          selected_tag=""
          while IFS= read -r candidate; do
            [ -n "${candidate}" ] || continue
            [ "$(git rev-list -n 1 "${candidate}")" = "${source_sha}" ] || continue
            releases="$(gh api --paginate --slurp \
              "/repos/${GH_REPO}/releases?per_page=100" \
              | jq -ce --arg tag "${candidate}" \
                '[.[][] | select(.tag_name == $tag)]')"
            test "$(jq 'length' <<<"${releases}")" -le 1
            if [ "$(jq 'length' <<<"${releases}")" -eq 0 ] || \
               ! jq -e '.[0] | .draft == false and .prerelease == true and
                         (.assets | any(.name == "release-manifest.json"))' \
                 <<<"${releases}" >/dev/null; then
              selected_tag="${candidate}"
              break
            fi
          done < <(git tag --list "${prefix}*" --sort=-version:refname)

          if [ -z "${selected_tag}" ]; then
            selected_tag="${next_tag}"
            if ! gh api --method POST "/repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${selected_tag}" -f "sha=${source_sha}" >/dev/null; then
              git fetch --force origin "refs/tags/${selected_tag}:refs/tags/${selected_tag}"
              test "$(git rev-list -n 1 "${selected_tag}")" = "${source_sha}"
            fi
          fi

          classification="$(python scripts/materialize_version.py \
            --tag "${selected_tag}" --classify)"
          {
            echo "source_sha=${source_sha}"
            echo "git_tag=$(jq -r '.git_tag' <<<"${classification}")"
            echo "release_type=$(jq -r '.release_type' <<<"${classification}")"
            echo "release_kind=$(jq -r '.release_kind' <<<"${classification}")"
            echo "version=$(jq -r '.version' <<<"${classification}")"
            echo "chart_version=$(jq -r '.chart_version' <<<"${classification}")"
            echo "image_version=$(jq -r '.image_version' <<<"${classification}")"
            echo "is_prerelease=$(jq -r '.is_prerelease' <<<"${classification}")"
          } >>"${GITHUB_OUTPUT}"

  release:
    name: Run common Release core
    needs: prepare-nightly
    permissions:
      actions: write
      contents: write
      packages: write
    uses: ./.github/workflows/release-ucm.yml
    with:
      git_tag: ${{ needs.prepare-nightly.outputs.git_tag }}
      release_type: ${{ needs.prepare-nightly.outputs.release_type }}
      version: ${{ needs.prepare-nightly.outputs.version }}
      chart_version: ${{ needs.prepare-nightly.outputs.chart_version }}
      image_version: ${{ needs.prepare-nightly.outputs.image_version }}
      release_kind: ${{ needs.prepare-nightly.outputs.release_kind }}
      is_prerelease: ${{ needs.prepare-nightly.outputs.is_prerelease == 'true' }}
      source_sha: ${{ needs.prepare-nightly.outputs.source_sha }}
    secrets: inherit
