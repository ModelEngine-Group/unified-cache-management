# CPU IO 功能测试 demo 的 kv client 配置（CPU-over-RoCE 真实链路；配套 sop/3.cpu-io-sop.md）
# KvClientConfig::LoadFromFile 解析，仅支持整行注释，不支持行内注释；相对路径相对进程工作目录。
# 本文件已按真实链路预置 provider 与 RoCE 传输段，使用前必改两处（其余键缺省可用）：
#   1. asu_info.1 的 local.comm_id / port：对端 KV store 的实际 IP 与监听端口（当前为占位值）
#   2. transport.roce_gid_index：本机 GID 表索引（必填，provider 不自动选择，取值取决于宿主机组网）
# 建议 3. transport.roce_hca_name：显式指定可用 HCA 设备名（本机经 ibv_devices 查询；
#   缺省自动选第一个 RDMA 设备，选中设备不可用时启动报错）
client.client_id=testtool-demo-cpuio
wait_timeout_ms=5000

# 单 key 请求走批量 IO 通路；路由环哈希（与缺省 conf/kv_client.conf 一致）
client.use_batch_io_for_single_key=true
client.hash_table.type=RING_HASH
client.ring_hash.virtual_node_count=128

# CPU-over-RoCE provider（配套 RoCE 传输段见下）
transport.asu_ids=1
transport.provider_type=CPU
# CPU 数据路径应答开关，CPU 链路必配 true（缺省回写模式会被 provider 拒绝，IO 全失败）
transport.send_response=true
transport.device_id=0

# 对端 KV store 端点：local.comm_id / port 改对端实际值（当前为占位值）
asu_info.1=protocol=TCP,local.comm_id=192.168.100.100,port=19001

# RoCE 传输段（缺省值已预置；各键完整含义见 conf/kv_client.conf 模板段注释，
# 对端 store 侧同名键前缀为 asu_roce_*，见 kv_semantics/docs/guide/roce-provider.md）
transport.roce_qp_backend=verbs
transport.roce_oob_role=client
transport.roce_oob_connect_timeout_ms=3000
transport.roce_handshake_timeout_ms=5000
transport.roce_hca_name=mlx5_0
transport.roce_hca_port=1
transport.roce_gid_index=3
transport.roce_sq_depth=256
transport.roce_rq_depth=64
transport.roce_cq_depth=512
transport.roce_inline_threshold=0
transport.roce_sl=3
transport.roce_traffic_class=104
transport.roce_qp_timeout=17
transport.roce_retry_cnt=7
transport.roce_rnr_retry=7
transport.roce_min_rnr_timer=12
transport.roce_qp_rd_atom=16
