name: Maintain UCM release capability issue

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ucm-release-capability-issue-${{ github.repository_id }}
  cancel-in-progress: true

jobs:
  maintain:
    name: Update blocked capability issue
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - name: Download the formal run's exact Runtime selection
        run: |
          set -euo pipefail
          mkdir -p out
          run_id=""
          artifact=""
          found=false
          for _ in $(seq 1 120); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-tag.yml/runs?event=push&per_page=50")"
            run_id="$(jq -r --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_REF_NAME}" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $ref)] |
               sort_by(.created_at) | last | .id // empty' <<<"${runs}")"
            if [ -n "${run_id}" ]; then
              artifact="ucm-runtime-selection-run-${run_id}"
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --jq '.artifacts[].name' | grep -Fxq "${artifact}"; then
                found=true
                break
              fi
            fi
            sleep 10
          done
          test "${found}" = true
          gh run download "${run_id}" --name "${artifact}" --dir out
          test -s out/runtime-selection.json
      - name: Render formal capability problems
        run: |
          set -euo pipefail
          PYTHONPATH=.github/release python -m ucm_release problems render \
            --selection out/runtime-selection.json \
            --summary out/problems-summary.md \
            --issue out/problems-issue.json \
            --action out/problems-action.json >/dev/null
          cat out/problems-summary.md >>"${GITHUB_STEP_SUMMARY}"
      - name: Maintain rolling Issue
        run: |
          set -euo pipefail
          title="$(jq -er '.title' out/problems-issue.json)"
          jq -er '.body' out/problems-issue.json >out/problems-issue.md
          action="$(jq -er '.action' out/problems-action.json)"
          issues="$(gh issue list --state all --limit 1000 --json number,title,state)"
          issue="$(jq -c --arg title "${title}" \
            '.[] | select(.title == $title)' <<<"${issues}" | head -n 1)"
          number=""
          state=""
          if [ -n "${issue}" ]; then
            number="$(jq -r '.number' <<<"${issue}")"
            state="$(jq -r '.state' <<<"${issue}")"
          fi
          if [ "${action}" = open_or_update ]; then
            if [ -z "${number}" ]; then
              gh issue create --title "${title}" --body-file out/problems-issue.md
            else
              [ "${state}" = OPEN ] || gh issue reopen "${number}"
              gh issue edit "${number}" --body-file out/problems-issue.md
            fi
          elif [ "${action}" = close ] && [ -n "${number}" ] && [ "${state}" = OPEN ]; then
            gh issue close "${number}" --comment \
              "All blocked upstream capabilities are resolved in ${GITHUB_REF_NAME}."
          fi
