<text x="235" y="378" text-anchor="middle" font-size="12.5" class="w5" fill="#A32D2D">suffix KV invalidated — full recompute</text>
<text x="235" y="394" text-anchor="middle" font-size="11.5" fill="#791F1F">cache lost exactly when the context is largest</text>
<text x="645" y="378" text-anchor="middle" font-size="12.5" class="w5" fill="#0F6E56">suffix KV reused as-is</text>
<text x="645" y="394" text-anchor="middle" font-size="11.5" fill="#085041">B: no HBM, no load, masked from attention</text>

