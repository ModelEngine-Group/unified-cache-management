# Example kv-test + ASU client config.
# Format: key=value. Lines starting with # are ignored.

# ASU client identity and wait behavior.
client_id=kv-test-client-0
wait_timeout_ms=5000
# Optional runtime library overrides. If omitted, kv-test tries
# KV_TEST_ASU_CLIENT_LIB/KV_TEST_ASU_TRANSPORT_LIB, dynamic linker search paths,
# and the default build-tree sibling directory.
# asu.client_library_path=/path/to/libasu_client.so
# asu.transport_library_path=/path/to/libasu_transport.so

# Relative paths in this file are resolved against the process working
# directory. The examples below assume kv-test is run from the repository root.

# The ASU view is loaded from a key-value file. Later refreshes re-read this
# file; changing the file is the external trigger for view changes.
view.config_path=./ucm/transport/kv/kv-test/asu_view.conf

# Keep transport.asu_ids aligned with the ASU ids in asu_view.conf.
hash_table.type=RING_HASH
ring_hash.virtual_node_count=128
# 0: one provider per ASU transport; 1: all ASU transports share one provider.
asu_shared_provider=0
# For multiple ASUs, list every id here and add matching asu_info entries below,
# for example: transport.asu_ids=1,2
transport.asu_ids=1
# Select the transport provider used by AsuTransportImpl.
# Supported values: AICPU, FAKE, AIV.
# AICPU and AIV providers are disabled by default at build time. Enable the
# matching BUILD_UCM_ASU_PROVIDER_* CMake option when testing them directly.
# Use FAKE for the local mock Send/CQE backend.
transport.provider_type=AIV
transport.device_id=0
# Consecutive completion polling rounds without a completed task before yielding.
transport.completion_poll_spin_limit=16
transport.localIp=127.0.0.1
transport.sc=true

# ASU endpoint list. Endpoint format:
# protocol=<UB|ROCE|TCP>,local.comm_id=<ip-or-comm-id>,port=<port>
#
# With the FAKE provider, protocol=TCP is a convenient placeholder for parser
# and validation compatibility; it does not imply real TCP IO. For real
# ASU/Hcomm testing, replace protocol/local.comm_id/port/device with the target
# setup and select AIV or AICPU. Configure the local provider device through
# transport.device_id.
fake_backend.path=./kv-test-fake-backend-store
fake_backend.latency_ms=1
fake_backend.worker_threads=8
asu_info.1=protocol=TCP,local.comm_id=127.0.0.1,port=19001

# kv-test data generation defaults.
kv.key_prefix=k
kv.seed=20260530
kv.value_size=4096
kv.count=16

# Operation limits used by kv-test validation.
limits.memory_max_bytes=4294967296

# Bench defaults. CLI flags can override these.
bench.io_size=4096
bench.concurrency=1
bench.duration_sec=10
# Set to a positive value to run exactly this many io_size-byte logical IOs instead of timing.
bench.io_count=0
bench.warmup_sec=1
bench.read_ratio=50
bench.write_ratio=50
bench.batch_size=16

# ResultWriter output directory.
output.path=./kv-test-output
output.realtime_file_max_bytes=104857600
