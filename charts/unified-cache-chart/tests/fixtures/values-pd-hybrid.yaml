# Standalone Helm fixture for the exact, case-sensitive Hybrid connector path.
# Render with: helm template hybrid . -f tests/fixtures/values-pd-hybrid.yaml
servingEngineSpec:
  enableEngine: true
  hostNetwork: false
  hostIPC: false
  dnsPolicy: ClusterFirst
  modelSpec:
    name: hybrid-fixture
    modelPath: /models/hybrid-fixture
    modelName: hybrid-fixture
    recoveryPolicy: ServingGroupRecreate
    gangPolicy:
      minRoleReplicas:
        prefill: 1
        decode: 1
    pd:
      prefill: prefill
      decode: decode
      antiAffinity: true
      kvTransfer:
        connector: MooncakeHybridConnector
        routerType: mooncake
        identity:
          engineIdBase: 0
          kvPortBase: 36000
          instanceStride: 100
      mooncake:
        master:
          enabled: false
    router:
      enabled: true
      inferenceEngine: vLLM
    roles:
      - name: prefill
        replicas: 1
        workerReplicas: 0
        resources: {}
        vllmArgs: |
          --tensor-parallel-size 1
      - name: decode
        replicas: 1
        workerReplicas: 0
        resources: {}
        vllmArgs: |
          --tensor-parallel-size 1
          --no-enable-prefix-caching
    unifiedcacheConfig:
      enabled: true
      kvcsStoreIdAutoDetect: false
      config:
        ucm_connectors:
          - ucm_connector_name: UcmPipelineStore
            ucm_connector_config:
              io_direct: false
              store_pipeline: Cache|Posix
              cache_buffer_capacity_gb: 1
              use_gdr: false
    storage:
      unifiedcacheStorage:
        - name: hybrid-cache
          mountPath: /cache
          hostPath:
            path: /tmp/uc-stack-hybrid-fixture
            type: DirectoryOrCreate
