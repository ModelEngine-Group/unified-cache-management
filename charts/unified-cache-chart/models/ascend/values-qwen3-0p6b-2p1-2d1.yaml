# ============================================================
# Qwen3-0.6B PD 分离 2P2D（Ascend / Mooncake + UCM）
# helm install qwen3-0p6b-2p1-2d1 -n yulei-test --create-namespace . -f values.yaml -f models/ascend/values-qwen3-0p6b-2p1-2d1.yaml
# 与 1P1D 仅差：prefill.replicas=2 / decode.replicas=2（xPyD）+ gangPolicy 对应；同节点同角色靠反亲和散开。
# ============================================================
mooncakeMaster:
  enabled: true
  create: true
  client:
    config: |
      {
        "metadata_server": "P2PHANDSHAKE",
        "global_segment_size": "80GB",
        "local_buffer_size": "4GB",
        "protocol": "ascend",
        "device_name": ""
      }
  # master 不占 NPU 卡（纯 CPU 控制面）；昇腾 driver/dcmi/hccn.conf 挂载由 chart 模板按 protocol=ascend 内置。
  # nodeSelector 钉 NPU 节点（标签按集群实际）；保留 rdma/rdma_shared 作调度双保险。
  resources:
    limits:   { rdma/rdma_shared: "1", cpu: "2", memory: 4Gi }
    requests: { rdma/rdma_shared: "1", cpu: "1", memory: 2Gi }
  nodeSelector:
    "accelerator": "huawei-Ascend910"

servingEngineSpec:
  enableEngine: true
  containerPort: 8000
  modelSpec:
    name: "qwen3-0p6b-2p1-2d1"                  # K8s 资源名片段：小写字母/数字/-，起止字母或数字；<release>-<name> <= 63
    modelPath: "/mnt/model/Qwen3-0.6B"
    modelName: "Qwen3-0.6B"
    shmSize: "128Gi"
    recoveryPolicy: ServingGroupRecreate          # 可选：ServingGroupRecreate（整组）| RoleRecreate（单 Role，默认）| None（Pod/Deployment 默认行为）
    restartGracePeriodSeconds: 60
    gangPolicy:
      minRoleReplicas:
        prefill: 2
        decode: 2
    # 无 runtime sidecar：router 直连引擎 8000、KV 走引擎自带连接器；如 kthena webhook 自动注入则由其托管。
    pd:
      kvTransfer:
        connector: MooncakeConnectorV1            # 可选（区分大小写）：MooncakeConnectorV1 | MooncakeHybridConnector | NixlConnector
        routerType: mooncake                       # Mooncake 两种 connector 对应 mooncake；NixlConnector 对应 nixl
        identity:
          engineIdBase: 0
          kvPortBase: 36000
          instanceStride: 100
      mooncake:
        master:
          enabled: true
      antiAffinity: true
      prefill: prefill
      decode: decode
    router:
      enabled: true
      inferenceEngine: vLLM
      trafficPolicy:
        timeout: 120s
    hooks:
      preStart: |
        echo "[hook] preStart: pod=${POD_NAME} kind=${UC_POD_KIND:-entry} master=${MASTER_IP} rank=${NODE_RANK}"
        export UC_PRESTART_MARK="${POD_NAME}"
      postReady: |
        echo "[hook] postReady: ${POD_IP}:${POD_PORT} is serving"
      preStop: |
        echo "[hook] preStop: pod=${POD_NAME} is stopping"
    roles:
      - name: prefill                         # role 名：小写字母/数字/-，起止字母或数字，最长 12
        replicas: 2                               # xPyD 的 x=2
        workerReplicas: 0
        resources:
          limits:   { huawei.com/Ascend910: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
          requests: { huawei.com/Ascend910: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
        vllmArgs: |
          --tensor-parallel-size 1
          --max-model-len 20000
          --block-size 128
          --gpu-memory-utilization 0.85
          --distributed-executor-backend mp
          --trust-remote-code
          --max-num-batched-tokens 16384
      - name: decode                         # role 名：小写字母/数字/-，起止字母或数字，最长 12
        replicas: 2                               # xPyD 的 y=2
        workerReplicas: 0
        resources:
          limits:   { huawei.com/Ascend910: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
          requests: { huawei.com/Ascend910: "1", rdma/rdma_shared: "1", cpu: "64", memory: 256Gi }
        vllmArgs: |
          --tensor-parallel-size 1
          --max-model-len 20000
          --block-size 128
          --gpu-memory-utilization 0.85
          --distributed-executor-backend mp
          --trust-remote-code
          --max-num-batched-tokens 16384
    env:
      - { name: VLLM_SERVER_DEV_MODE, value: "1" }
    unifiedcacheConfig:
      enabled: true                         # false = 不使用 UCM（不注 UCMConnector、不渲染 ucm ConfigMap、不挂缓存盘）
      kvcsStoreIdAutoDetect: false
      config:
        enable_event_sync: true
        use_layerwise: true
        ucm_connectors:
          - ucm_connector_name: "UcmPipelineStore"
            ucm_connector_config:
              io_direct: false
              store_pipeline: "Cache|Posix"
              cache_buffer_capacity_gb: 64
              use_gdr: false
    storage:
      unifiedcacheStorage:
        - name: model-data                    # Volume/PVC 名片段：小写字母/数字/-，起止字母或数字
          mountPath: /mnt/data
          dynamicPVC:
            pvcStorage: "1Ti"
            storageClass: a800-192-168-4-106
            pvcAccessMode: [ "ReadWriteMany" ]
      extraStorage:
        - name: timezone-volume
          mountPath: /etc/localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
            type: File
        - name: models
          mountPath: /mnt/model
          nfs:
            server: 192.168.3.6
            path: /public_model
        - name: hccn-conf
          mountPath: /etc/hccn.conf
          readOnly: true
          hostPath:
            path: /etc/hccn.conf
            type: File
        - name: hccn-tool
          mountPath: /usr/local/Ascend/driver/tools/hccn_tool
          readOnly: true
          hostPath:
            path: /usr/local/Ascend/driver/tools/hccn_tool
            type: File

        # ===== 双挂载（多缓存后端）示例 =====
        # 取消注释即再挂一块静态盘：storage_backends 按 mountPath 顺序拼成 "/mnt/data:/data-0"。
        # kvcsStoreIdAutoDetect=true 时，每块 PV 都需在 csi.volumeAttributes.kvcacheStoreId 标注 store id，
