<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020">
<rect width="100%" height="100%" fill="#fff"/>
<text x="36" y="56.0" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#182737" text-anchor="start">KVClient 切批与结果回填</text>
<text x="36" y="91.0" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#465a70" text-anchor="start">SGLang direct linker 的 KV / index 示例。方括号内为原始输入下标，协议上限以 2 条为例。</text>
<rect x="36" y="115" width="906" height="78" fill="#edf5fc" stroke="#5485af" stroke-width="2"/>
<text x="489.0" y="148.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">Mooncake 字符串 key</text>
<text x="489.0" y="177.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">输入下标 0 / 1 对应 Block 0 的 KV / index，之后依次排列 Block 1、2、3</text>
<rect x="981" y="115" width="223" height="78" fill="#edf8f3" stroke="#51967d" stroke-width="2"/>
<text x="1092.5" y="148.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">ASUStore</text>
<text x="1092.5" y="177.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">二进制 key 保留 8 字节</text>
<path d="M489 193L489 222 M484.47113714620934 213.0843171180467L489 222L493.52886285379066 213.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<path d="M1092 193L1092 222 M1087.4711371462092 213.0843171180467L1092 222L1096.5288628537908 213.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<rect x="36" y="222" width="906" height="79" fill="#edf5fc" stroke="#5485af" stroke-width="2"/>
<text x="489.0" y="255.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">KeyResolver · 字符串路径</text>
<text x="489.0" y="284.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">提取 group / pool、PP → XXH32 得 GNSID；剩余 key → XXH64 得 8 字节 key</text>
<rect x="981" y="222" width="223" height="79" fill="#edf8f3" stroke="#51967d" stroke-width="2"/>
<text x="1092.5" y="255.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">二进制路径</text>
<text x="1092.5" y="284.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">使用配置的 kv_ns_id</text>
<path d="M489 301L489 330 M484.47113714620934 321.0843171180467L489 330L493.52886285379066 321.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<path d="M1092 301L1092 330 M1087.4711371462092 321.0843171180467L1092 330L1096.5288628537908 321.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<rect x="36" y="330" width="1168" height="80" fill="#f2f5f8" stroke="#8c9bad" stroke-width="2"/>
<text x="620.0" y="363.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">KVClient · ASU 路由</text>
<text x="620.0" y="392.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">仅用 8 字节 key 选 ASU；示例中 Block 0、2、3 → ASU 1，Block 1 → ASU 2</text>
<path d="M620 410L620 439 M615.4711371462093 430.0843171180467L620 439L624.5288628537907 430.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<rect x="36" y="439" width="1168" height="178" fill="#fff3e2" stroke="#c87824" stroke-width="2"/>
<text x="620.0" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#182737" text-anchor="middle">Client · 按 ASU + namespace 建 TransportTask</text>
<text x="620.0" y="501.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">一次遍历路由结果，直接移动请求条目，同时保存 originalIndices</text>
<rect x="58" y="526" width="354" height="72" fill="#edf5fc" stroke="#5485af" stroke-width="2"/>
<text x="235.0" y="559.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">ASU 1 · KV 任务</text>
<text x="235.0" y="588.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">[0, 4, 6]</text>
<rect x="440" y="526" width="354" height="72" fill="#fff3e2" stroke="#c87824" stroke-width="2"/>
<text x="617.0" y="559.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">ASU 1 · index 任务</text>
<text x="617.0" y="588.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">[1, 5, 7]</text>
<rect x="822" y="526" width="360" height="72" fill="#f2f5f8" stroke="#8c9bad" stroke-width="2"/>
<text x="1002.0" y="559.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">ASU 2 · 两个任务</text>
<text x="1002.0" y="588.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">[2]、[3]，同样切批</text>
<path d="M235 617L235 648 M230.47113714620932 639.0843171180467L235 648L239.52886285379068 639.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<path d="M617 617L617 648 M612.4711371462093 639.0843171180467L617 648L621.5288628537907 639.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<path d="M1002 617L1002 648 M997.4711371462093 639.0843171180467L1002 648L1006.5288628537907 639.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<rect x="36" y="648" width="1168" height="138" fill="#f2f5f8" stroke="#8c9bad" stroke-width="2"/>
<text x="620.0" y="686.0" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#182737" text-anchor="middle">IoScheduler · SplitBatchView 按协议上限切批</text>
<text x="620.0" y="719.0" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#182737" text-anchor="middle">KV：[0, 4] + [6]     index：[1, 5] + [7]     ASU 2：[2]、[3]</text>
<text x="620.0" y="756.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">子批次继承任务的 namespaceId，填入 SQE.kv_ns_id → ASU 执行</text>
<path d="M620 786L620 819 M615.4711371462093 810.0843171180467L620 819L624.5288628537907 810.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<rect x="36" y="819" width="1168" height="78" fill="#f2f5f8" stroke="#8c9bad" stroke-width="2"/>
<text x="620.0" y="852.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">TransportTask · 按子批顺序汇总</text>
<text x="620.0" y="881.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">例如 KV 的 [6] 先返回，汇总顺序仍为 [0, 4, 6]。</text>
<path d="M620 897L620 928 M615.4711371462093 919.0843171180467L620 928L624.5288628537907 919.0843171180467" fill="none" stroke="#465a70" stroke-width="2"/>
<rect x="36" y="928" width="1168" height="70" fill="#edf8f3" stroke="#51967d" stroke-width="2"/>
<text x="620.0" y="961.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#182737" text-anchor="middle">ClientTask · 按 originalIndices 回填</text>
<text x="620.0" y="990.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#465a70" text-anchor="middle">回填到 [0, 1, 2, 3, 4, 5, 6, 7]；全部任务收敛后唤醒 Wait。</text>
</svg>
