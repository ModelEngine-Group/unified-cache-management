# 只建链验证配置（onlyconnect=on）：完成 kv client 建链 + 值缓冲池分配注册（regionRegister）
# 后挂起等待 Ctrl+C，不解析 input、不下任何 IO —— 用于在目标机器上单独验证建链与 region 注册链路。
# 配套 kv client 配置：同目录 kv_client_real.conf（真机端点在其中修改）。
# 启动命令（在 testTool 目录下执行）：
#   ./build/testTool demo/conf/test_config_onlyconnect.conf demo/conf/kv_client_real.conf

testmode = 1 # 仅执行模式使用；只建链模式不解析 input，此值不生效
runtime = 10 # 仅执行模式使用；只建链模式下不生效
loop = 1 # 仅执行模式使用；只建链模式下不生效
perf = off # off：输出全量日志（info 级建链与注册信息可见）；建链验证建议 off
onlyconnect = on # on：只建链，不下 IO（建链 + region 注册完成后挂起等待 Ctrl+C）

startcoreid = 0 # 只建链模式不启动 worker 线程（不绑核），此值仅保存不生效
numjobs = 1 # 同上；仅执行模式生效

buffersize = 1048576 # 值缓冲单块容量（字节）：region 注册的单元大小，按目标环境压力调整
buffercount = 256 # 值缓冲块数：region 注册的块数量（256 块 x 1MB = 256MB host 内存）
buffertype = host # host: 主机内存注册（MemoryType=HOST）；device: 设备内存注册（MemoryType=DEVICE，需目标机器设备环境配合）
deviceid = 0 # 设备 ID（buffertype=device 时使用）

# log 参数（独立目录 log_demo/，不与默认 log/ 混用；日志目录不存在时自动创建）
readlogdir = log_demo/get # 读log的位置（仅执行模式使用）
logdir = log_demo/ # 日志输出目录
log.level = info # 全量日志最低级别：debug|info|warn|error
log.pattern = [%Y-%m-%d %H:%M:%S.%e] [%l] [%t] %v # 日志输出格式（值不能含 '#'；语法同 spdlog pattern）
log.file_name = nds_%Y%m%d_%H.log # 全量日志文件名（%Y%m%d_%H 等时间标记按启动时刻展开）
log.warn_file_name = nds_warn_%Y%m%d_%H.log # warn 专用文件名（记录 warn 及以上）
log.error_file_name = nds_error_%Y%m%d_%H.log # error 专用文件名（记录 error 及以上）
log.max_file_size = 10485760 # 单文件大小上限（字节），写满滚动
log.max_files = 4 # 滚动文件保留个数（不含活跃文件；0 不清理）
log.async_queue_size = 8192 # 异步队列长度（满则阻塞）
log.async_flush_interval_ms = 100 # 周期刷盘间隔（毫秒）
