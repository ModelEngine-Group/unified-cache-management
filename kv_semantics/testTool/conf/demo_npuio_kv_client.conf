# NPU IO 功能测试 demo 的 kv client 配置（HCCP KV-over-RoCE 真实链路；配套 sop/4.npu-io-sop.md）
# KvClientConfig::LoadFromFile 解析，仅支持整行注释，不支持行内注释；相对路径相对进程工作目录。
# 本文件已按 HCCP 链路预置 provider，使用前必改三处（其余键缺省可用）：
#   1. transport.hccp_kv_roce_lib_path：算子库主体绝对路径（当前为占位值）；两个内核 so
#      （librdma_kv_send_kernel.so / librdma_kv_wait_kernel.so）必须与主体同目录
#      （算子库内部约定，分目录放置无法找到）
#   2. asu_info.1 的 local.comm_id / port：对端 KV store 的 IP 填在 local.comm_id（provider 取该
#      字段作 remote IP，留空被拒；当前为占位值）、port 指向对端监听端口
#   3. transport.device_id：本机 NPU 卡号（多卡环境按实际设备改）
client.client_id=testtool-demo-npuio
wait_timeout_ms=5000

# 单 key 请求走批量 IO 通路；路由环哈希（与缺省 conf/kv_client.conf 一致）
client.use_batch_io_for_single_key=true
client.hash_table.type=RING_HASH
client.ring_hash.virtual_node_count=128

# HCCP KV-over-RoCE provider（NPU 数据面；kv client 须以 --mode npu 构建，见 sop/4 第 1 节）
transport.asu_ids=1
transport.provider_type=HCCP_KV_OVER_ROCE
transport.device_id=0

# 对端 KV store 端点：local.comm_id 填对端 IP（当前为占位值）
asu_info.1=protocol=TCP,local.comm_id=192.168.100.100,port=19001

# 算子库主体路径（同目录须放置 send / wait 两个内核 so；当前为占位值）
# 进阶：transport.hccp_kv_roce_<field> 可覆盖算子 InitConfig（mem_size / timeout_ms /
# sdk_ioq_depth 等，字段表见 kv_semantics/docs/guide/hccp-kv-over-roce-provider.md）
transport.hccp_kv_roce_lib_path=/opt/hccp/libhccp_kv_over_roce.so
transport.hccp_kv_roce_max_connections=3072
