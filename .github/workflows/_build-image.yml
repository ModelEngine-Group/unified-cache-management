name: Build one UCM runtime image

on:
  workflow_call:
    inputs:
      image_id:
        type: string
        required: true
      runner:
        type: string
        required: true
      plan_artifact:
        type: string
        required: true
      upload_oci:
        type: boolean
        required: true
      source_ref:
        type: string
        required: false
        default: ""
    outputs:
      image_artifact:
        description: OCI archive artifact produced when upload_oci is enabled
        value: ${{ jobs.build.outputs.image_artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    outputs:
      image_artifact: ${{ steps.task.outputs.image_artifact }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.plan_artifact }}
          path: input/plan
      - id: task
        name: Select image task and wheel
        env:
          IMAGE_ID: ${{ inputs.image_id }}
        run: |
          set -euo pipefail
          mkdir -p out context
          PYTHONPATH=.github/release python -m ucm_release compact select \
            --plan input/plan/release-plan.json --kind image --id "${IMAGE_ID}" \
            --output out/image-task.json >/dev/null
          wheel_id="$(jq -r '.wheel_id' out/image-task.json)"
          wheel_artifact="ucm-wheel-${wheel_id}-run-${GITHUB_RUN_ID}"
          image_artifact="ucm-image-${IMAGE_ID}-run-${GITHUB_RUN_ID}"
          {
            echo "wheel_artifact=${wheel_artifact}"
            echo "image_artifact=${image_artifact}"
          } >>"${GITHUB_OUTPUT}"
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ steps.task.outputs.wheel_artifact }}
          path: input/wheel
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Build install-only runtime image
        run: |
          set -euo pipefail
          wheel="$(find input/wheel -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          cp .github/release/docker/Dockerfile.runtime context/Dockerfile
          cp examples/ucm_config_example.yaml context/ucm_config_example.yaml
          cp "${wheel}" "context/$(basename "${wheel}")"
          base="$(jq -er '.runtime.image_reference' out/image-task.json)"
          docker buildx build \
            --platform "$(jq -r '.platform' out/image-task.json)" \
            --file context/Dockerfile \
            --target runtime \
            --build-arg "BASE_IMAGE=${base}" \
            --build-arg "UCM_WHEEL=$(basename "${wheel}")" \
            --output type=oci,dest=out/image.oci.tar \
            --progress plain context
          test -s out/image.oci.tar
      - name: Verify runtime glibc, Python, OS, and UCM import
        env:
          IMAGE_ID: ${{ inputs.image_id }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo
          local_tag="ucm-runtime-check:${IMAGE_ID}"
          wheel_glibc_floor="$(jq -er '.glibc_floor | select(type == "string")' \
            input/wheel/wheel-result.json)"
          runtime_requirements="$(jq -ce '.dependencies | select(type == "array")' \
            input/wheel/wheel-result.json)"
          deferred_external_libraries="$(jq -ce \
            '.deferred_external_libraries | select(type == "array")' \
            input/wheel/wheel-result.json)"
          config_sha256="$(sha256sum examples/ucm_config_example.yaml | cut -d' ' -f1)"
          skopeo copy "oci-archive:out/image.oci.tar" "docker-daemon:${local_tag}"
          docker run --rm --entrypoint sh \
            -e DEFERRED_EXTERNAL_LIBRARIES="${deferred_external_libraries}" \
            -e EXPECTED_PYTHON="$(jq -r '.runtime.python_version' out/image-task.json)" \
            -e EXPECTED_OS_ID="$(jq -r '.runtime.os_id' out/image-task.json)" \
            -e EXPECTED_OS_VERSION="$(jq -r '.runtime.os_version' out/image-task.json)" \
            -e EXPECTED_WHEEL_GLIBC_FLOOR="${wheel_glibc_floor}" \
            -e EXPECTED_BACKEND_DISTRIBUTION="$(jq -r '.distribution' input/wheel/wheel-result.json)" \
            -e EXPECTED_UCM_VERSION="$(jq -r '.version' input/wheel/wheel-result.json)" \
            -e EXPECTED_EXTERNAL_LIBRARIES="$(jq -c '.external_libraries' input/wheel/wheel-result.json)" \
            -e EXPECTED_RUNTIME_REQUIREMENTS="${runtime_requirements}" \
            -e EXPECTED_UCM_CONFIG_SHA256="${config_sha256}" \
            -v "${PWD}/.github/release/validate_wheel_runtime.py:/tmp/validate_wheel_runtime.py:ro" \
            "${local_tag}" -c '
              set -eu
              ldd_output="$(ldd --version 2>&1)"
              actual_glibc="$(python3 -c "import re, sys; match = re.search(r\"[0-9]+(?:\\.[0-9]+)+\", sys.argv[1]); print(match.group(0) if match else \"\")" "${ldd_output}")"
              wheel_glibc_floor="${EXPECTED_WHEEL_GLIBC_FLOOR#GLIBC_}"
              test -n "${actual_glibc}"
              test -n "${wheel_glibc_floor}"
              printf "Runtime glibc: actual=%s wheel-floor=%s\n" \
                "${actual_glibc}" "${EXPECTED_WHEEL_GLIBC_FLOOR}"
              python3 -c "import sys; parse=lambda value: tuple(map(int, value.split(\".\"))); sys.exit(0 if parse(sys.argv[1]) >= parse(sys.argv[2]) else 1)" \
                "${actual_glibc}" "${wheel_glibc_floor}"
              actual_python="$(python3 -c \
                "import sys; print(\"%d.%d\" % sys.version_info[:2])")"
              test "${actual_python}" = "${EXPECTED_PYTHON}"
              . /etc/os-release
              if [ "${EXPECTED_OS_ID}" != linux ] && \
                 [ "${EXPECTED_OS_ID}" != unreported ]; then
                test "$(printf %s "${ID}" | tr "[:upper:]" "[:lower:]")" = \
                  "$(printf %s "${EXPECTED_OS_ID}" | tr "[:upper:]" "[:lower:]")"
              fi
              if [ "${EXPECTED_OS_VERSION}" != unreported ]; then
                test "${VERSION_ID}" = "${EXPECTED_OS_VERSION}"
              fi
              printf "Runtime OS: actual=%s:%s planned=%s:%s\n" \
                "${ID}" "${VERSION_ID}" "${EXPECTED_OS_ID}" "${EXPECTED_OS_VERSION}"
              python3 -c "import hashlib, os, pathlib; path=pathlib.Path(\"/workspace/ucm_config_example.yaml\"); actual=hashlib.sha256(path.read_bytes()).hexdigest(); assert actual == os.environ[\"EXPECTED_UCM_CONFIG_SHA256\"], actual"
              python3 /tmp/validate_wheel_runtime.py
            '
      - if: ${{ inputs.upload_oci }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.task.outputs.image_artifact }}
          path: out/image.oci.tar
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 90 || 7 }}
