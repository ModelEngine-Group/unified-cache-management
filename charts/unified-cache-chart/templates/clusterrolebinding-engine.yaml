{{- if .Values.servingEngineSpec.enableEngine -}}
{{- $modelSpec := .Values.servingEngineSpec.modelSpec -}}
{{- $ucmConfigEnabled := eq (include "chart.ucmConfigEnabled" (list $modelSpec)) "true" -}}
{{- $kvcsStoreIdAutoDetectEnabled := eq (include "chart.kvcsStoreIdAutoDetectEnabled" (list $modelSpec)) "true" -}}
{{- if and $ucmConfigEnabled $kvcsStoreIdAutoDetectEnabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "{{ include "chart.clusterScopedInstanceName" (list . "engine-pv-reader-binding") }}"
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.engineServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: "{{ include "chart.enginePvReaderClusterRoleName" . }}"
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
{{- end -}}
