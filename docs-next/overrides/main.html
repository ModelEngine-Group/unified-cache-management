{% extends "base.html" %}

<!-- KaTeX math rendering (CDN-loaded so it works under the i18n folder layout) -->
{% block extrahead %}
  {{ super() }}
  <link rel="stylesheet" href="https://unpkg.com/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap">
  <style>
    /* Light-mode header: white background with dark text and dark logo.
       Dark mode keeps the slate header untouched. */
    [data-md-color-scheme="default"] .md-header {
      background-color: #ffffff;
      color: rgba(0,0,0,.75);
      box-shadow: 0 0 .2rem rgba(0,0,0,.07), 0 .2rem .4rem rgba(0,0,0,.07);
    }
    [data-md-color-scheme="default"] .md-header__topic,
    [data-md-color-scheme="default"] .md-header__topic .md-ellipsis,
    [data-md-color-scheme="default"] .md-header .md-icon,
    [data-md-color-scheme="default"] .md-header .md-header__nav,
    [data-md-color-scheme="default"] .md-header .md-search__icon {
      color: rgba(0,0,0,.75);
    }
    [data-md-color-scheme="default"] .md-header .md-search__input {
      color: rgba(0,0,0,.85);
      background-color: rgba(0,0,0,.04);
    }
    [data-md-color-scheme="default"] .md-header .md-search__input::placeholder {
      color: rgba(0,0,0,.5);
    }
    [data-md-color-scheme="default"] .md-header__logo img {
      filter: brightness(0) opacity(0.7);
    }
    [data-md-color-scheme="default"] .md-tabs {
      background-color: #ffffff;
      color: rgba(0,0,0,.75);
      border-bottom: .05rem solid rgba(0,0,0,.08);
    }
    [data-md-color-scheme="default"] .md-tabs__link { color: rgba(0,0,0,.65); }
    [data-md-color-scheme="default"] .md-tabs__link--active,
    [data-md-color-scheme="default"] .md-tabs__link:hover { color: rgba(0,0,0,.9); }
    /* Sidebars and header use Jost; body content uses the theme font (Inter) */
    .md-header, .md-nav, .md-sidebar, .md-toc, .md-tabs {
      --md-text-font-family: "Jost", system-ui, -apple-system, "Segoe UI",
        Roboto, "Noto Sans", "Liberation Sans", Arial, sans-serif;
      font-family: var(--md-text-font-family);
      font-size: 0.85rem;
    }
    /* Slightly smaller body content */
    .md-typeset { font-size: 0.72rem; line-height: 1.55; }
    /* Bolder and larger top bar; sidebar sub-navs get progressively smaller */
    .md-header { font-weight: 700; font-size: 0.92rem; }
    .md-header .md-header__topic,
    .md-header .md-tabs__link { font-weight: 700; }
    .md-nav .md-nav { font-size: 0.9em; }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="https://unpkg.com/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
    document$.subscribe(() => {
      renderMathInElement(document.body, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false},
          {left: "\\(", right: "\\)", display: false},
          {left: "\\[", right: "\\]", display: true}
        ],
        throwOnError: false
      });
    });
  </script>
{% endblock %}
