# testTool 测试配置（缺省执行模式：建链 + 下 IO，simu 环境直接可用）
# 只建链验证：改 onlyconnect = on（建链 + region 注册后挂起等 Ctrl+C，不解析 input、不下 IO），启动命令见 sop/0
testmode = 1 # 输入文件类型。 1: input.txt不带value  2： input.txt带value
runtime = 10 # 运行时长。单位：秒。 >0 压测到达时间后退出（长稳测试用大秒值：86400=24h、604800=7d；任务流跑完一圈而时间未到则从头循环再跑，跑满即停）； runtime=0 为循环模式，以loop为准。
loop = 1 # 请求循环执行次数。当runtime = 0 时生效，此时loop需要大于0。
ratelimit_mb = 0 # 带宽限速（MB/s）。0: 不限速  >0: 秒级时间窗控制——窗口内提交字节（任务 entry length 总和）达上限后阻塞等到下一秒再发；适配长稳测试的注入速率控制
p99_interval_s = 10 # 接口时延 P99 打印间隔（秒）。0: 禁用  >0: 每 n 秒打印一行总 P99 与分接口（exist/put/get/delete）P99；口径为滚动最近样本（每执行器每接口保留最近 8192 个任务级样本）
metrics_exporter = off # Prometheus 抓取端点开关。on: 启动 HTTP /metrics 端点（Prometheus 文本协议，端口 metrics_exporter_port）供 Prometheus pull 抓取，Grafana 可接数据源
metrics_exporter_port = 9450 # Prometheus 抓取端点监听端口（metrics_exporter=on 时生效）
perf = on # on: 压测模式，仅记失败请求明细（成功不记，未命中属失败）。 off: 输出全量日志与请求明细
onlyconnect = off # on: 只建链不下IO（建链 + region 注册后挂起等 Ctrl+C，不解析 input——真机建链链路单独验证用）； off: 建链、下IO（缺省）
autodisconnect = 0 # 建链后自动断开时长（秒）。0: 禁用  >0: 建链成功 n 秒后自动断开连接——断开后进程不退出，继续挂起等 Ctrl+C 供观察断链后状态（仅 onlyconnect = on 时生效；断开走优雅断链——先注销 region 再发送断链协议帧并销毁 QP，对端可感知）

startcoreid = 24 # 工具绑的起始核；worker i 绑 startcoreid+i（绑核失败整测退出——startcoreid+numjobs 不得超过环境核数）
numjobs = 16 # 并发 worker 线程数；共享任务流（每任务仅执行一次），段内并发执行，sleep 段末全员同步停顿

buffersize = 1048576 # 值缓冲单块容量（字节）。建链时分配注册一次；须不小于 input 单条指令最大 length
buffercount = 256 # 值缓冲块数。建链时分配注册一次；须不小于单任务最大 entry 数（batch 条数）；多 worker 在飞任务共享本池，空闲块不足时阻塞等待
buffertype = cpu # 值缓冲内存类型（决定注册 MemoryType 与分配来源）。 cpu: 主机内存（HOST）  gpu: CUDA 显存（DEVICE，须编入 TESTTOOL_ENABLE_CUDA，否则启动直接报错——不做主机内存模拟，避免误判已测通）  npu: ACL NPU 内存（DEVICE，须编入 TESTTOOL_ENABLE_ASCEND，否则启动直接报错——不做主机内存模拟，避免误判已测通）
deviceid = 0 # 设备 ID（buffertype=gpu/npu 时使用：CUDA device / ACL device 编号）

# log 参数
log.dir = log/ # 主日志目录
log.file_name = tt_%Y%m%d_%H.log # 主日志文件名（时间标记按启动时刻展开）
log.get_dir = log/request/ # get 明细日志目录
log.get_file_name = get_%Y%m%d_%H.log # get 明细日志文件名
log.other_dir = log/request/ # put/exist/delete 明细日志目录
log.other_file_name = other_%Y%m%d_%H.log # put/exist/delete 明细日志文件名

log.level = info # 日志最低级别：trace|debug|info|warn|error|critical
log.console = on # 是否打印到控制台（主日志与 get/other 明细同款生效）：on 打印 off 仅落盘
log.pattern = %Y-%m-%d %H:%M:%S.%f TT_%n [%^%L%$] %P,%t [%s:%#,%!]  %v # 日志格式（值不能以空白接 '#'；TT_ 为 testTool 标识前缀，%n 为 logger 名 main/get/other，%L 缩写级别、%^ %$ 包裹彩色范围——仅终端生效，%P 进程号 %t 线程号 %s:%#,%! 调用点文件名:行号,函数名；语法同 spdlog pattern）
log.max_file_size = 10485760 # 单文件大小上限（字节），写满滚动
log.max_files = 4 # 滚动保留个数（不含活跃文件；0 不清理）
log.async_queue_size = 8192 # 异步队列长度（满则阻塞）
log.async_flush_interval_ms = 100 # 周期刷盘间隔（毫秒）
