<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img">
<title>How a hole maps onto the block grid</title>
<desc>A pruned span starts and ends mid-block: the head and tail boundary blocks are retained, loaded, and partially masked; only fully-covered interior blocks are skipped.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.w5{font-weight:500}
