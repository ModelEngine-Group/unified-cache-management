<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
<title>Vanilla and edit-resolved hash spaces</title>
<desc>Blocks before the first hole stay in the shared vanilla hash space; blocks after it are re-keyed with an edit-set digest salt so recomputed blocks never pollute other namespaces.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.w5{font-weight:500}
</style>
<rect width="880" height="400" fill="#FFFFFF"/>

<text x="40" y="34" font-size="16" class="w5" fill="#2C2C2A">Hash-space design — strict mode namespaces</text>
<text x="40" y="56" font-size="12.5" fill="#5F5E5A">recomputed blocks live in a salted namespace and can never pollute vanilla or other plans' blocks</text>

<text x="60" y="100" font-size="12" fill="#5F5E5A">blocks:</text>
<g text-anchor="middle">
<rect x="130" y="84" width="90" height="38" rx="7" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="175" y="109" font-size="12" fill="#444441">B0</text>
<rect x="228" y="84" width="90" height="38" rx="7" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="273" y="109" font-size="12" fill="#444441">B1</text>
<rect x="326" y="84" width="90" height="38" rx="7" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="371" y="109" font-size="12" fill="#444441">B2</text>
<rect x="424" y="84" width="90" height="38" rx="7" fill="#FAC775" stroke="#BA7517" stroke-dasharray="5 3"/>
<text x="469" y="103" font-size="12" fill="#633806">B3</text>
<text x="469" y="117" font-size="9.5" fill="#854F0B">hole</text>
<rect x="522" y="84" width="90" height="38" rx="7" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="567" y="109" font-size="12" fill="#444441">B4</text>
<rect x="620" y="84" width="90" height="38" rx="7" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="665" y="109" font-size="12" fill="#444441">B5</text>
</g>
<text x="840" y="109" font-size="12" fill="#5F5E5A">…</text>

<text x="60" y="172" font-size="12" fill="#5F5E5A">hashes:</text>
<line x1="130" y1="160" x2="710" y2="160" stroke="#888780" stroke-width="1.4"/>
<g text-anchor="middle">
<circle cx="175" cy="160" r="3.5" fill="#5F5E5A"/><text x="175" y="182" font-size="10.5" fill="#5F5E5A">h0</text>
<circle cx="273" cy="160" r="3.5" fill="#5F5E5A"/><text x="273" y="182" font-size="10.5" fill="#5F5E5A">h1</text>
<circle cx="371" cy="160" r="3.5" fill="#5F5E5A"/><text x="371" y="182" font-size="10.5" fill="#5F5E5A">h2</text>
<circle cx="469" cy="160" r="3.5" fill="none" stroke="#BA7517" stroke-width="1.6"/><text x="469" y="182" font-size="10.5" fill="#854F0B">h3</text>
<circle cx="567" cy="160" r="3.5" fill="none" stroke="#888780" stroke-width="1.4"/><text x="567" y="182" font-size="10.5" fill="#5F5E5A">h4</text>
<circle cx="665" cy="160" r="3.5" fill="none" stroke="#888780" stroke-width="1.4"/><text x="665" y="182" font-size="10.5" fill="#5F5E5A">h5</text>
</g>

<rect x="130" y="208" width="286" height="60" rx="10" fill="#E6F1FB" stroke="#378ADD"/>
<text x="273" y="230" text-anchor="middle" font-size="12.5" class="w5" fill="#0C447C">vanilla hash space</text>
<text x="273" y="248" text-anchor="middle" font-size="11" fill="#185FA5">shared with ALL requests, unchanged</text>
<line x1="273" y1="190" x2="273" y2="204" stroke="#378ADD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>

<rect x="424" y="208" width="286" height="60" rx="10" fill="#E1F5EE" stroke="#1D9E75"/>
<text x="567" y="230" text-anchor="middle" font-size="12.5" class="w5" fill="#0F6E56">edit-resolved space</text>
<text x="567" y="248" text-anchor="middle" font-size="11" fill="#085041">salt = sha256(cumulative hole set H)</text>
<line x1="567" y1="190" x2="567" y2="204" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr)"/>

<text x="40" y="298" font-size="12" fill="#5F5E5A">key formula:</text>
<rect x="130" y="284" width="580" height="30" rx="7" fill="#F1EFE8" stroke="#D3D1C7"/>
<text x="145" y="303" dominant-baseline="central" font-family="Consolas,monospace" font-size="12" fill="#2C2C2A">hash(parent, tokens)                      hash(parent, tokens, salt = sha256(H))</text>

<rect x="40" y="332" width="800" height="46" rx="10" fill="#EAF3DE" stroke="#97C459"/>
<text x="440" y="351" text-anchor="middle" font-size="12" fill="#27500A">monotonic plans (holes only grow) keep the digest stable across turns, so turn N+2's strict blocks hit what turn N+1 wrote.</text>
<text x="440" y="369" text-anchor="middle" font-size="12" fill="#27500A">Relaxed mode needs none of this: its suffix blocks stay in the vanilla space, shared with everyone.</text>
</svg>
