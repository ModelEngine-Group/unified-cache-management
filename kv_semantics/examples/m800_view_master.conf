# M800 Master example / M800 Master 配置示例
# mon_host, client_name, keyring and agent_lib are mandatory and must be set explicitly.
# The keyring file must exist and contain a non-empty key; agent_lib must point to the real library.
# Replace the test-only MON address with the actual deployment address.
view.role = master
view.listen_addr = 0.0.0.0:9100
view.ceph.mon_host = 127.0.0.1:6789
view.ceph.client_name = admin
view.ceph.keyring = /etc/ceph/ceph.client.admin.keyring
view.ceph.agent_lib = /usr/lib/libkv_agent.so
view.ceph.agent_fetch_timeout_ms = 10000
view.refresh_interval_ms = 30000
view.http_timeout_ms = 2000
view.endpoint_protocol = ub
view.endpoint_port = 6000
view.ceph.filter = in
