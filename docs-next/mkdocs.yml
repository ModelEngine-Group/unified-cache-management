site_name: Unified Cache Manager
site_url: https://ucm.readthedocs.io/
site_description: >-
  Unified Cache Manager (UCM) persists LLM KVCache and replaces redundant
  computations through multiple retrieval mechanisms.

repo_url: https://github.com/ModelEngine-Group/unified-cache-management
repo_name: ModelEngine-Group/ucm
edit_uri: edit/develop/docs-next/docs/en/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/UCM-light.png
  favicon: assets/images/UCM-dark.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: Unified Cache Manager 中文站点
          nav_translations:
            Home: 首页
            User Guide: 用户指南
            Installation: 安装
            Model Tour: 模型示例
            Getting Started: 快速开始
            Deploy: 部署
            Deployment Frameworks: 部署框架
            Kubernetes: Kubernetes
            pyMotor: pyMotor
            Support Matrix: 支持矩阵
            Capabilities: 核心能力
            Overview: 概览
            Prefix Cache: 前缀缓存
            Observability: 观测能力
            Metrics: 指标监控
            Diagnostics: 诊断工具
            Trace Mode: Trace 模式
            Developer Guide: 开发者指南
            Architecture: 架构
            Capability Principles: 能力原理
            Add Metrics: 添加指标
            Extending Store: 扩展存储
            Contribute: 贡献
            Reference: 参考
            API & Parameters: API 与参数
            Benchmark: 性能测试
            Toolkit: 工具集
            KV Cache Calculator: KV Cache 计算器
            Developer: 开发者
            Design: 设计文档
  - search:
      separator: '[\s\u200b\-]'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ModelEngine-Group/unified-cache-management
    - icon: fontawesome/brands/docker
      link: https://github.com/ModelEngine-Group/unified-cache-management/pkgs/container/unified-cache-manager
  version:
    provider: mike

nav:
  - Home: index.md
  - User Guide:
      - user-guide/index.md
      - Installation: user-guide/installation.md
      - Getting Started: user-guide/engines/index.md
      - Support Matrix: user-guide/support-matrix/index.md
      - Deploy: 
          - user-guide/deploy/index.md
          - PD Colocated: user-guide/deploy/pd-colocated.md
          - PD Disaggregated: user-guide/deploy/pd-disaggregated.md
      - Deployment Frameworks:
          - user-guide/frameworks/index.md
          - Kubernetes: user-guide/frameworks/kubernetes.md
          - pyMotor: user-guide/frameworks/pyMotor.md
      - Model Tour:
          - user-guide/model-tour/index.md
          - GLM:
              - user-guide/model-tour/glm/index.md
          - Qwen:
              - user-guide/model-tour/qwen3/index.md
          - DeepSeek:
              - user-guide/model-tour/deepseek/index.md
          - MiniMax:
              - user-guide/model-tour/minimax/index.md
          - Kimi:
              - user-guide/model-tour/kimi/index.md
      - Capabilities:
          - Overview: user-guide/capabilities/index.md
          - Prefix Cache: user-guide/capabilities/prefix-cache/index.md
      - Observability:
          - Overview: user-guide/observability/index.md
          - Metrics: user-guide/observability/metrics.md
      - Diagnostics:
          - Overview: user-guide/diagnostics/index.md
          - Trace Mode: user-guide/diagnostics/trace-mode.md
  - Developer Guide:
      - Architecture: developer-guide/architecture.md
      - Capability Principles: developer-guide/capability-principles.md
      - Add Metrics: developer-guide/add-metrics.md
      - Extending Store: developer-guide/extending-store.md
      - Contribute: developer-guide/contribute.md
  - Reference:
      - API & Parameters: reference/api-parameters.md
  - Benchmark: benchmark/index.md
  - Toolkit:
      - toolkit/index.md
      - KV Cache Calculator: toolkit/kv-cache-calculator.md
      - User Guide:
          - dev-sandbox: toolkit/user/dev-sandbox.md
          - metrics-view: toolkit/user/metrics-view.md
          - nic-monitor: toolkit/user/nic-monitor.md
          - posix-aio: toolkit/user/posix-aio.md
          - precheck: toolkit/user/precheck.md
      - Developer:
          - Design: toolkit/developer/design.md
          - dev-sandbox: toolkit/developer/dev-sandbox.md
