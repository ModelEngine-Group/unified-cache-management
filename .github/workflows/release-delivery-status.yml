name: Release delivery status

on:
  workflow_run:
    workflows: ['UCM Tag Release · Stable, Prerelease, Draft, and Nightly']
    types: [in_progress, completed]

# Partial reruns skip successful start jobs. Run lifecycle events supplement the
# publisher's direct gate/result writes, including a cancelled publisher.
permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: ucm-release-operations-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Refresh the current release attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release-operations/delivery.py observe
