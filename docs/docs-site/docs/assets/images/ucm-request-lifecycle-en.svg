<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 784" width="960" height="784" role="img" aria-labelledby="ucm-request-lifecycle-en-title ucm-request-lifecycle-en-desc"><title id="ucm-request-lifecycle-en-title">Cache I/O for one request</title><desc id="ucm-request-lifecycle-en-desc">The Scheduler queries cache and hands off metadata; the Worker waits before Attention and reports release after saving settles and the request finishes.</desc><defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#24373b}.name{font-size:20px;font-weight:600}.small{font-size:16px;fill:#51666b}.title{font-size:28px;font-weight:600}.edge{fill:none;stroke:#6b8084;stroke-width:1.6}.zone{fill:#f6f9f8;stroke:#d5e2df;stroke-width:1}.box{fill:#fff;stroke:#91a6a7;stroke-width:1.2}.focus{fill:#edf8f5;stroke:#009485;stroke-width:1.6}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b8084"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#009485"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#466b86"/></marker></defs><rect width="960" height="784" fill="#fff"/><text x="48" y="44" text-anchor="start" class="title">Cache I/O for one request</text><line x1="120" y1="136" x2="120" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="344" y1="136" x2="344" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="568" y1="136" x2="568" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="792" y1="136" x2="792" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="120" y1="168" x2="792" y2="168" class="edge" marker-end="url(#arrow)"/><rect x="568.0" y="136" width="208" height="24" rx="4" fill="#fff"/><text x="672" y="152" text-anchor="middle" class="small">Look up blocks</text><line x1="792" y1="224" x2="120" y2="224" class="edge" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="568.0" y="192" width="208" height="24" rx="4" fill="#fff"/><text x="672" y="208" text-anchor="middle" class="small">Matched blocks</text><line x1="120" y1="280" x2="344" y2="280" class="edge" marker-end="url(#arrow)"/><rect x="128.0" y="248" width="208" height="24" rx="4" fill="#fff"/><text x="232" y="264" text-anchor="middle" class="small">Scheduled metadata</text><line x1="344" y1="336" x2="792" y2="336" class="edge" marker-end="url(#arrow)"/><rect x="568.0" y="304" width="208" height="24" rx="4" fill="#fff"/><text x="672" y="320" text-anchor="middle" class="small">Submit load</text><line x1="792" y1="392" x2="344" y2="392" class="edge" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="568.0" y="360" width="208" height="24" rx="4" fill="#fff"/><text x="672" y="376" text-anchor="middle" class="small">Load wait completes</text><line x1="344" y1="448" x2="568" y2="448" class="edge" marker-end="url(#arrow)"/><rect x="352.0" y="416" width="208" height="24" rx="4" fill="#fff"/><text x="456" y="432" text-anchor="middle" class="small">Compute remainder</text><line x1="568" y1="504" x2="344" y2="504" class="edge" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="352.0" y="472" width="208" height="24" rx="4" fill="#fff"/><text x="456" y="488" text-anchor="middle" class="small">Layer KV ready</text><line x1="344" y1="560" x2="792" y2="560" class="edge" marker-end="url(#arrow)"/><rect x="568.0" y="528" width="208" height="24" rx="4" fill="#fff"/><text x="672" y="544" text-anchor="middle" class="small">Submit save</text><line x1="792" y1="616" x2="344" y2="616" class="edge" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="568.0" y="584" width="208" height="24" rx="4" fill="#fff"/><text x="672" y="600" text-anchor="middle" class="small">Save task settles</text><line x1="344" y1="672" x2="120" y2="672" class="edge" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="128.0" y="640" width="208" height="24" rx="4" fill="#fff"/><text x="232" y="656" text-anchor="middle" class="small">Report finished IDs</text><rect x="16" y="72" width="208" height="64" rx="8" class="box"/><text x="120.0" y="104" text-anchor="middle" class="name">Scheduler</text><text x="120.0" y="128" text-anchor="middle" class="small">with UCM scheduler</text><rect x="240" y="72" width="208" height="64" rx="8" class="focus"/><text x="344.0" y="104" text-anchor="middle" class="name">Worker</text><text x="344.0" y="128" text-anchor="middle" class="small">with UCM worker</text><rect x="464" y="72" width="208" height="64" rx="8" class="box"/><text x="568.0" y="104" text-anchor="middle" class="name">Attention</text><text x="568.0" y="128" text-anchor="middle" class="small">Engine computation</text><rect x="688" y="72" width="208" height="64" rx="8" class="box"/><text x="792.0" y="104" text-anchor="middle" class="name">Store</text><text x="792.0" y="128" text-anchor="middle" class="small">External cache I/O</text><line x1="48" y1="728" x2="912" y2="728" stroke="#d5e2df"/><text x="48" y="752" text-anchor="start" class="small">Simplified success path; per-layer work repeats and saving can overlap execution.</text><text x="48" y="776" text-anchor="start" class="small">Release follows request finish and task settlement; see text for error handling.</text></svg>
