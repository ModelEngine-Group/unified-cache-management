# M800 Worker example / M800 Worker 配置示例
# master_addrs is required and must use numeric IPv4/IPv6 addresses.
# Masters are tried sequentially; this is not a maximum-epoch election.
# Workers only fetch Master HTTP views and do not load the Ceph Agent.
view.role = worker
view.master_addrs = 127.0.0.1:9100,127.0.0.1:9101
view.http_timeout_ms = 2000
view.endpoint_protocol = ub
view.endpoint_port = 6000
view.ceph.filter = in
