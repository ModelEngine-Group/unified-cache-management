# kv client 配置（KvClientConfig::LoadFromFile 解析，仅支持整行注释）
# 相对路径相对进程工作目录，建议在 testTool 目录下运行

# 客户端标识与默认等待超时
client.client_id=testtool-client-0
wait_timeout_ms=5000

# 单 key 请求走批量 IO 通路
client.use_batch_io_for_single_key=true

# 路由哈希表类型与环哈希虚拟节点数
client.hash_table.type=RING_HASH
client.ring_hash.virtual_node_count=128

# ASU 传输配置：FAKE provider（本地模拟收发，无需真实 ASU）
transport.asu_ids=1
transport.provider_type=FAKE
transport.device_id=0

# ASU 1 的端点（FAKE 下 TCP 为占位值，不产生真实网络 IO）
asu_info.1=protocol=TCP,local.comm_id=127.0.0.1,port=19001

# 视图配置文件（Init 时加载建链，后续刷新重读本文件）
view.config_path=conf/kv_client_view.conf
