<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img">
<title>Plaintext edit vs KV context edit</title>
<desc>Left: editing the transcript breaks the hash chain, invalidates suffix KV, and orphans the stored suffix blocks. Right: declaring a hole keeps the chain intact; the UCM connector loads every block except the hole from the full store.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.w5{font-weight:500}
</style>
<rect width="880" height="660" fill="#FFFFFF"/>

<text x="40" y="34" font-size="16" class="w5" fill="#2C2C2A">Plaintext edit vs KV context edit</text>
<text x="40" y="56" font-size="12.5" fill="#5F5E5A">same history, same pruning intent — applied at a different layer</text>

<rect x="40" y="76" width="390" height="322" rx="12" fill="#FCEBEB" stroke="#F09595"/>
<rect x="450" y="76" width="390" height="322" rx="12" fill="#E1F5EE" stroke="#5DCAA5"/>

