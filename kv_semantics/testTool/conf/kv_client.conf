# kv client 配置（KvClientConfig::LoadFromFile 解析，仅支持整行注释，不支持行内注释）
# 相对路径相对进程工作目录，建议在 testTool 目录下运行。
#
# 本文件为 simu 环境缺省配置（FAKE provider，无需真实 ASU），流程验证 / 压测直接
# 使用。真机验证建链时不改本文件：复制为独立副本（如 kv_client_roce.conf /
# kv_client_hccp.conf）改副本的传输段与端点即可——单文件模式：建链端点即本文件
# 的 asu_info.N，只维护这一份配置（恢复双文件模式见文末 view.config_path 说明）。

# 客户端标识与默认等待超时
client.client_id=testtool-client-0
wait_timeout_ms=5000

# 推理引擎键解析（string key 的命名空间字段解析方式；8 字节二进制 key 直通不解析）：
# generic（缺省）/ vllm_ascend / sglang，testTool 压测用缺省 generic 即可
#inference.engine=generic

# 单 key 请求走批量 IO 通路
client.use_batch_io_for_single_key=true

# 路由哈希表类型与环哈希虚拟节点数
client.hash_table.type=RING_HASH
client.ring_hash.virtual_node_count=128

# ASU 传输配置。provider_type 取值：
#   FAKE               本地模拟收发（无需真实 ASU，simu 缺省）
#   AICPU / AIV        真机 provider（kv client 构建时需开启对应 provider 宏）
#   CPU                CPU-over-RoCE 建链（配套旋钮见下方 RoCE 模板段）
#   HCCP_KV_OVER_ROCE  NPU 数据面 HCCP 链路（配套键见下方 HCCP 模板段）
# transport.asu_ids：ASU 节点编号列表，与下方 asu_info.N 保持一致
# transport.device_id：设备 ID（真机环境按实际设备编号）
transport.asu_ids=1
transport.provider_type=FAKE
transport.device_id=0

# ASU 1 的端点（FAKE 下 TCP 为占位值，不产生真实网络 IO）
# 真机多节点示例（副本中按环境改）：
# asu_info.2=protocol=TCP,local.comm_id=141.xx.xx.1,port=19001
# asu_info.3=protocol=TCP,local.comm_id=142.xx.xx.1,port=19001
asu_info.1=protocol=TCP,local.comm_id=127.0.0.1,port=19001

# ---- CPU-over-RoCE provider 配置模板（真实建链时在副本中取消注释并按环境改值）----
# 启用三步：① transport.provider_type 改为 CPU；② asu_info.N 的 port 指向对端 KV store
# 监听端口；③ 取消注释并填写必填项 roce_gid_index，其余键缺省取默认值。
# 注意：本工具（kv client 侧）键名前缀为 transport.roce_*；对端 KV store 配置中的
# 同名键前缀为 asu_roce_*（两侧前缀不同、键主体一致，详见 kv_semantics/docs/guide/roce-provider.md）。
# 各键含义与默认值：
#   roce_qp_backend：verbs 真实 HCA / simulated 无 HCA 的协议测试（其余值拒绝）
#   roce_oob_role：client 主动连 / server 监听（本端建链取默认 client）
#   roce_oob_bind_ip：server 监听地址（client 侧无需配置，缺省本机 IP）
#   roce_oob_connect_timeout_ms：TCP 建连/接受超时（缺省 3000）
#   roce_handshake_timeout_ms：每次消息交互超时（缺省 5000）
#   roce_hca_name：HCA 设备名，如 mlx5_0。缺省自动取设备列表第一个 RDMA 设备；无任何设备、
#       或选中设备端口非 ACTIVE（不可用）时启动直接报错——此时建议显式指定可用设备名
#       （本机可用设备可经 ibv_devices 查询）；显式指定的名称不存在时同样报错
#   roce_hca_port：HCA 端口，1~255，0 非法（缺省 1）
#   roce_gid_index：必填——GID 表索引，provider 不自动选择（GID 表哪一项可用取决于宿主机
#       组网，无法自动推断）；未配置该键启动直接报错
#   roce_sq_depth / roce_rq_depth / roce_cq_depth：队列深度（缺省 256 / 64 / 512）
#   roce_inline_threshold：每次发送的内联数据大小（缺省 0）
#   roce_sl / roce_traffic_class：服务等级 / 流量类别（缺省 3 / 104）
#   roce_qp_timeout / roce_retry_cnt / roce_rnr_retry / roce_min_rnr_timer：
#       QP 重传相关定时器与计数（缺省 17 / 7 / 7 / 12）
#   roce_qp_rd_atom：在飞 read/atomic 请求上限（缺省 16）
#transport.roce_qp_backend=verbs
#transport.roce_oob_role=client
#transport.roce_oob_bind_ip=
#transport.roce_oob_connect_timeout_ms=3000
#transport.roce_handshake_timeout_ms=5000
#transport.roce_hca_name=mlx5_0
#transport.roce_hca_port=1
#transport.roce_gid_index=3
#transport.roce_sq_depth=256
#transport.roce_rq_depth=64
#transport.roce_cq_depth=512
#transport.roce_inline_threshold=0
#transport.roce_sl=3
#transport.roce_traffic_class=104
#transport.roce_qp_timeout=17
#transport.roce_retry_cnt=7
#transport.roce_rnr_retry=7
#transport.roce_min_rnr_timer=12
#transport.roce_qp_rd_atom=16

# ---- HCCP KV-over-RoCE provider 配置模板（NPU 数据面链路，副本中取消注释并改值；
# 详细 ABI 契约与算子库要求见 kv_semantics/docs/guide/hccp-kv-over-roce-provider.md）----
# 启用三步：① transport.provider_type 改为 HCCP_KV_OVER_ROCE（kv client 需以
# RUNTIME_ENVIRONMENT=ascend + BUILD_KV_CLIENT_PROVIDER_HCCP_KV_OVER_ROCE=ON 构建，
# 一键脚本 bash scripts/build-kv-link.sh --mode npu 已内置）；② asu_info.N 的
# local.comm_id 填对端 IP（provider 取该字段作 remote IP，留空被拒）、port 指向
# 对端监听端口；③ 取消注释并填写算子库主体路径 hccp_kv_roce_lib_path。
#   hccp_kv_roce_lib_path：算子库主体绝对路径，如 /opt/hccp/libhccp_kv_over_roce.so；
#       两个内核 so（librdma_kv_send_kernel.so / librdma_kv_wait_kernel.so）必须与
#       主体同目录（算子库内部约定，分目录放置无法找到）；缺省按动态链接搜索路径
#       查找缺省名
#   hccp_kv_roce_max_connections：QPC HBM 槽数（512B/槽，3072 槽 ≈ 1.5MiB；缺省 3072）
#   进阶：transport.hccp_kv_roce_<field> 可覆盖算子 InitConfig（mem_size / timeout_ms /
#       sdk_ioq_depth 等，字段表见 guide）——缺省即可跑通建链，仅调优时使用
#transport.hccp_kv_roce_lib_path=/opt/hccp/libhccp_kv_over_roce.so
#transport.hccp_kv_roce_max_connections=3072

# 视图配置（缺省单文件模式：不配本键，建链端点直接取本文件 transport.asu_ids +
# asu_info.N，只维护一份配置）。
# 如需运行期刷新拓扑（IO 运行中改端点能生效）或对齐生产 M800 view service 结构，
# 取消下行注释并另建 view 文件（键：viewEpoch / viewId / asuIds / asu_info.N，
# asu_info.N 写法与本文件相同；view 没列的节点静默不建链，启用后两文件须保持一致）：
#view.config_path=conf/kv_client_view.conf
