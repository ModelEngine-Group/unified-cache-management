<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一条请求的缓存读写</title><style>body{margin:0;background:white}svg{display:block;max-width:100%;height:auto;margin:auto}</style><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 784" width="960" height="784" role="img" aria-labelledby="ucm-request-lifecycle-zh-title ucm-request-lifecycle-zh-desc"><title id="ucm-request-lifecycle-zh-title">一条请求的缓存读写</title><desc id="ucm-request-lifecycle-zh-desc">Scheduler 查询并交接元数据，Worker 等待加载后执行 Attention，保存任务结束且请求完成后反馈资源释放。</desc><defs><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#24373b}.name{font-size:20px;font-weight:600}.small{font-size:16px;fill:#51666b}.title{font-size:28px;font-weight:600}.edge{fill:none;stroke:#6b8084;stroke-width:1.6}.zone{fill:#f6f9f8;stroke:#d5e2df;stroke-width:1}.box{fill:#fff;stroke:#91a6a7;stroke-width:1.2}.focus{fill:#edf8f5;stroke:#009485;stroke-width:1.6}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6b8084"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#009485"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#466b86"/></marker></defs><rect width="960" height="784" fill="#fff"/><text x="48" y="44" text-anchor="start" class="title">一条请求的缓存读写</text><line x1="120" y1="136" x2="120" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="344" y1="136" x2="344" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="568" y1="136" x2="568" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="792" y1="136" x2="792" y2="704" stroke="#c4d1cf" stroke-dasharray="4 4"/><line x1="120" y1="168" x2="792" y2="168" class="edge" marker-end="url
