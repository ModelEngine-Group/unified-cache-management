<text x="235" y="455" text-anchor="middle" font-size="11.5" fill="#791F1F">lookup by NEW chain hashes → miss after the edit point</text>

<rect x="450" y="418" width="390" height="46" rx="9" fill="#E1F5EE" stroke="#5DCAA5"/>
