<text x="440" y="428" text-anchor="middle" font-size="12" fill="#444441">Only fully-covered interior blocks are skipped. The head and tail blocks of a hole are retained, loaded, and masked at token granularity.</text>
<text x="440" y="448" text-anchor="middle" font-size="12" fill="#5F5E5A">For a multi-block tool result, boundary overhead is at most two blocks — everything in between is pure savings.</text>
