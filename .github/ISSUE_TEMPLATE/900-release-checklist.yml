name: Release Checklist
description: Plan and manage a release through structured requirements and a checklist.
title: '[Release] UCM v'
labels: [release]
body:
  - type: textarea
    id: release_information
    attributes:
      label: Release Information
      description: >-
        Fill in the release version and other release information. Every Issue assigned to the version Milestone is in scope.
        Close those Issues, the Release Checklist, and the Bug Archive before publishing the release.
        The bot closes the Milestone after successful delivery.
      value: |
        <!-- ucm-release-navigation:start -->
        Version links will appear after initialization.
        <!-- ucm-release-navigation:end -->

        version:
        branch: develop
        release_manager:
        test_lead:
        release_date: TBD
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: >-
        Use a task-list title followed by indented Details. Add an Issue reference to reuse an Issue, or write a title to create one.
        Indent fields by two spaces. Put description and pull_requests content on the following lines, indented by four spaces.
        Add one PR number or URL per line under pull_requests to link it in Development.
      value: |
        <!-- ucm-requirement-template
        To link existing PRs, enter one same-repository PR number or URL per line after the dash.
        Run /release_init or /update to link them in Development. The bot writes back their status.

          pull_requests:
            -

        Copy the block below outside this comment for each requirement.
        Use a title for a new Issue. Append #number or an Issue URL to reuse an Issue.
        Keep Details and field indentation unchanged.

        - [ ] Requirement title
          Optional title continuation

          <details>
          <summary>Details</summary>

          assignee:

          description:
            Describe the requirement.

            Acceptance criteria:
            - Describe the expected result.

          pull_requests:
            -

          </details>
        -->
    validations:
      required: true
  - type: textarea
    id: release_notes
    attributes:
      label: Release Notes
      description: Review and update this section.
      value: |
        - [ ] Summarize new features.
        - [ ] Summarize bug fixes.
        - [ ] Document compatibility changes.
        - [ ] Document upgrade instructions.
        - [ ] Document known issues.
  - type: textarea
    id: functional_tests
    attributes:
      label: Functional Tests
      description: Review and update this section.
      value: |
        - [ ] Verify the requirements in this release.
        - [ ] Verify the bug fixes targeted for this release.
        - [ ] Record test results and evidence.
        - [ ] Review unresolved bugs and release blockers.
  - type: textarea
    id: documentation_tests
    attributes:
      label: Documentation Tests
      description: Review and update this section.
      value: |
        - [ ] Verify installation instructions.
        - [ ] Verify configuration and usage examples.
        - [ ] Update the user guide.
        - [ ] Update the developer guide.
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Review and update this section.
      value: |
        - [ ] Build and verify the wheel package.
        - [ ] Build and verify the container image.
        - [ ] Confirm artifact versions match the release version.
  - type: textarea
    id: change_log
    attributes:
      label: Change Log
      description: Review and update this section.
      value: |
        reason: Initial scope.
