# ===== 镜像配置 =====
# 镜像集中在此，切换环境只改这里。
# kthena-only：本 chart 只渲染 vLLM 引擎镜像。
# 旧 router / sidecar / initContainer / runtimeSidecar 镜像随 native + ucm-router 一并移除（chart 不再渲染）。
images:
  # registry：全局仓库前缀（如 harbor.xxx.com/project）；留空不加前缀，已含 registry 的镜像不重复添加
  registry: ""
  # pullPolicy：镜像拉取策略
  pullPolicy: ""
  # image：vLLM 推理引擎镜像（后端由镜像本身决定 CUDA/Ascend，vLLM 自动探测）；可被 modelSpec.image 按模型覆盖
  image: "registry.dev.huawei.com/flash_stor/ucm-vllm-cuda:v25.5.0"
  # engine：发布自动化使用的结构化不可变镜像引用。设置时优先于 image；digest 同时存在时优先于 tag。
  # engine:
  #   repository: "ghcr.io/modelengine-group/vllm-openai"
  #   tag: "v0.21.0-ucm-0.5.0rc1"
  #   digest: "sha256:<64 lowercase hex>"
  # mooncakeMasterImage：自创建 Mooncake master 镜像；留空复用 images.image
  mooncakeMasterImage: ""
  # mooncakeMaster：Mooncake master 的结构化引用；优先于 mooncakeMasterImage，digest 优先于 tag。
  # mooncakeMaster:
  #   repository: "ghcr.io/modelengine-group/ucm-mooncake-master"
  #   tag: "0.5.0rc1-candidate-r1"
  #   digest: "sha256:<64 lowercase hex>"

# ===== Mooncake master（可选，共享基础服务）=====
# Mooncake master 不属于 kthena ModelServing role。需要 Mooncake master 的 PD release：
#   1) 顶层启用 master：mooncakeMaster.enabled=true，并选择 create=true 自创建或 external.rpcAddress 复用外部 master；
#   2) 本次 PD 显式使用 master：servingEngineSpec.modelSpec.pd.mooncake.master.enabled=true。
mooncakeMaster:
  enabled: false
  create: false
  # 自建 master 默认使用宿主网络；客户端仍通过 ClusterIP Service 访问稳定 DNS。
  hostNetwork: true
  hostIPC: true
  dnsPolicy: "ClusterFirstWithHostNet"
  # mooncake_master 原生启动参数；chart 把每个非注释行按空白拆成 container args。
  # 自创建 master 启动前会先 export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"。
  args: |
    --port 50088
    --metrics_port 9003
    --eviction_high_watermark_ratio 0.9
    --eviction_ratio 0.1
    --default_kv_lease_ttl 11000
  service:
    type: ClusterIP
    rpcPort: 50088
    metricsPort: 9003
    annotations: {}
  external:
    # create=false 时必填，例如 "mooncake-master.kv-system.svc:50088"。
    rpcAddress: ""
  client:
    # Helm 固定生成 /vllm-workspace/UnifiedCache/mooncake/mooncake.json，
    # 并注入 MOONCAKE_CONFIG_PATH；master_server_address 由 chart 自动补，用户不要手写。
    # protocol 跟平台相关，必须放到具体模型模板里：CUDA/GPU 通常用 rdma，Ascend/NPU 用 ascend。
    config: ""
    # 追加到使用 master 的 prefill/decode Pod；MOONCAKE_* 托管变量禁止在这里覆盖。
    env: []
  env: []
  containerSecurityContext:
    capabilities:
      add:
        - IPC_LOCK
  podAnnotations: {}
  # master 是纯 CPU 控制面，resources 不要写加速卡键（不占 NPU/GPU 配额）。
  # Ascend（client.config.protocol=ascend）时模板自动内置宿主机挂载
  # /usr/local/Ascend/driver 与 /etc/hccn.conf（仅 NPU 节点存在），
  # 请用 nodeSelector/affinity 把 master 钉到 NPU 节点，避免调度到无驱动节点 FailedMount。
  nodeSelector: {}
  tolerations: []
  affinity: {}


# ===== 互联网卡（跨节点通信网卡）自动探测（与 nodeTopologyConfig 同级）=====
# autoDetectInterface：默认 true。启动脚本按“K8s 节点 IP(HOST_IP) → 归属网卡”自动探测，
#   扇出到 GLOO/HCCL/NCCL/TP_SOCKET_IFNAME 及 VLLM_NETWORK_INTERFACE/VLLM_USE_NETIF，
#   并派生 HCCL_IF_IP，且置 VLLM_DETECT_MULTI_IP=0（已固定网卡，无需多 IP 探测）。
#   VLLM_HOST_IP 不自动派生；需要固定 Mooncake/vLLM 注册地址时在 nodeTopologyConfig 中按节点显式设置。
#   需 hostNetwork=true 才能看到宿主机网卡；非 hostNetwork 时跳过探测并告警。
#   显式 nodeTopologyConfig 值优先，探测不覆盖。Ray worker（KubeRay）暂不在自动探测范围内。
autoDetectInterface: true
# forceInterface：硬覆盖网卡名（独立 fabric 等探测会选错的场景）；留空=不强制
forceInterface: ""
# interfaceEnvVars：自定义扇出的变量名集合；留空用内置超集（GPU/Ascend 通用，多余变量被忽略）
interfaceEnvVars: []
# ===== Node Topology（与 servingEngineSpec 同级）=====
