name: UCM Tag Release · Stable, Prerelease, Draft, and Nightly

on:
  push:
    tags: ["v*", "draft/v*", "nightly/*"]

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/nightly/') && format('ucm-nightly-{0}', github.repository_id) || format('ucm-tag-wrapper-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify-tag:
    name: Classify immutable Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      git_tag: ${{ steps.classify.outputs.git_tag }}
      release_type: ${{ steps.classify.outputs.release_type }}
      release_kind: ${{ steps.classify.outputs.release_kind }}
      version: ${{ steps.classify.outputs.version }}
      chart_version: ${{ steps.classify.outputs.chart_version }}
      image_version: ${{ steps.classify.outputs.image_version }}
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
      publication_scope: ${{ steps.classify.outputs.publication_scope }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r .github/release/requirements.txt
      - id: classify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          classification="$(python scripts/materialize_version.py \
            --tag "${RELEASE_TAG}" --classify --version-config version.ini)"
          if [ "$(jq -r '.release_type' <<<"${classification}")" = nightly ]; then
            branch="$(PYTHONPATH=.github/release python -c '
            import os
            from ucm_release.nightly import Nightly
            item = Nightly.parse(os.environ["RELEASE_TAG"])
            print("" if item.legacy_base else item.branch)')"
            if [ -n "${branch}" ]; then
              git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${branch}"
            fi
            python .github/release/ucm_release/cleanup.py record \
              --repository "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" \
              --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --output-dir out/cleanup
          fi
          repository="${GITHUB_REPOSITORY,,}"
          if [ "${repository}" = modelengine-group/unified-cache-management ]; then
            publication_scope=official
          else
            publication_scope=fork
          fi
          {
            echo "git_tag=$(jq -r '.git_tag' <<<"${classification}")"
            echo "release_type=$(jq -r '.release_type' <<<"${classification}")"
            echo "release_kind=$(jq -r '.release_kind' <<<"${classification}")"
            echo "version=$(jq -r '.version' <<<"${classification}")"
            echo "chart_version=$(jq -r '.chart_version' <<<"${classification}")"
            echo "image_version=$(jq -r '.image_version' <<<"${classification}")"
            echo "is_prerelease=$(jq -r '.is_prerelease' <<<"${classification}")"
            echo "publication_scope=${publication_scope}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() && hashFiles('out/cleanup/*.json') != '' }}
        with:
          name: ucm-release-cleanup-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: out/cleanup/*.json
          if-no-files-found: error
          retention-days: 90

  version-check:
    name: Release · Check version operations
    needs: classify-tag
    if: ${{ needs.classify-tag.outputs.publication_scope == 'official' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ucm-release-operations-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Check release completion for the Tag
        env:
          GH_TOKEN: ${{ github.token }}
          UCM_PROJECT_TOKEN: ${{ secrets.UCM_PROJECT_TOKEN }}
          RELEASE_TAG: ${{ needs.classify-tag.outputs.git_tag }}
          RELEASE_VERSION: ${{ needs.classify-tag.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: python .github/release-operations/delivery.py gate

  release:
    name: Run Release core
    needs: [classify-tag, version-check]
    if: >-
      ${{ !cancelled() && needs.classify-tag.result == 'success' &&
          (needs.classify-tag.outputs.publication_scope == 'fork' ||
           !startsWith(github.ref, 'refs/tags/v') || needs.version-check.result == 'success') }}
    permissions:
      actions: write
      contents: write
      packages: write
    uses: ./.github/workflows/release-ucm.yml
    with:
      git_tag: ${{ needs.classify-tag.outputs.git_tag }}
      release_type: ${{ needs.classify-tag.outputs.release_type }}
      version: ${{ needs.classify-tag.outputs.version }}
      chart_version: ${{ needs.classify-tag.outputs.chart_version }}
      image_version: ${{ needs.classify-tag.outputs.image_version }}
      release_kind: ${{ needs.classify-tag.outputs.release_kind }}
      is_prerelease: ${{ needs.classify-tag.outputs.is_prerelease == 'true' }}
      source_sha: ${{ github.sha }}
      publication_scope: ${{ needs.classify-tag.outputs.publication_scope }}
    secrets:
      PYPI_API_TOKEN: ${{ needs.classify-tag.outputs.publication_scope == 'official' && secrets.PYPI_API_TOKEN || '' }}
      TEST_PYPI_API_TOKEN: ${{ needs.classify-tag.outputs.publication_scope == 'fork' && secrets.TEST_PYPI_API_TOKEN || '' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}

  delivery-result:
    name: Release · Close delivered Milestone
    needs: [classify-tag, version-check, release]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
          needs.version-check.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ucm-release-operations-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Verify delivery and close the Milestone
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.classify-tag.outputs.git_tag }}
          RELEASE_VERSION: ${{ needs.classify-tag.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: python .github/release-operations/delivery.py finish
