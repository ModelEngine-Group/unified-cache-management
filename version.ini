# Tag examples:
#   Stable:     v0.8.0
#   Prerelease: v0.8.0rc3
#   Draft:      draft/v0.8.0-1
#   Nightly:    nightly/v0.8.0-20260919-1 (adjust the date and daily sequence)
# Commit the code to package, then create and push a tag. Draft example:
#   git tag draft/v0.8.0-1
#   git push origin draft/v0.8.0-1
# Pushing the tag triggers packaging; Draft releases remain drafts.
# The base version (0.8.0 here) must match UCM_VERSION below. Never reuse a tag.
# Packaging runs in the repository that origin points to.
UCM_VERSION=0.8.0
UCM_SUPPORTED_VLLM_VERSIONS=0.26,0.27,0.28
UCM_SUPPORTED_VLLM_ASCEND_VERSIONS=0.23,0.24,0.25,0.26
UCM_SUPPORTED_SGLANG_VERSIONS=0.5.18,0.5.19,0.5.20
