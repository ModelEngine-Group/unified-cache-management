# Standalone defaults; embedded in default_metric_descriptors.h at build time.
metric_prefix: "kv:"

counter:
  - {name: "kv_client_batch_load_requests_total", documentation: "Total KV client batch-load submissions"}
  - {name: "kv_client_batch_load_entries_total", documentation: "Total entries submitted to KV client batch-load operations"}
  - {name: "kv_client_batch_load_errors_total", documentation: "Total failed KV client batch-load submissions"}
  - {name: "kv_client_batch_store_requests_total", documentation: "Total KV client batch-store submissions"}
  - {name: "kv_client_batch_store_entries_total", documentation: "Total entries submitted to KV client batch-store operations"}
  - {name: "kv_client_batch_store_errors_total", documentation: "Total failed KV client batch-store submissions"}

histogram:
  - {name: "kv_client_batch_load_submit_duration_seconds", documentation: "KV client batch-load submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
  - {name: "kv_client_batch_store_submit_duration_seconds", documentation: "KV client batch-store submission duration", buckets: [0.00001, 0.00005, 0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]}
