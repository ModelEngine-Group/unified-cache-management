name: Build, verify, and publish one trusted Tag image

on:
  workflow_call:
    inputs:
      image_id:
        type: string
        required: true
      runner:
        type: string
        required: true
      plan_artifact:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    environment: release-production
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: PyYAML==6.0.2 packaging==24.2
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ inputs.plan_artifact }}
          path: input/plan
      - id: task
        name: Select trusted Tag image task
        env:
          IMAGE_ID: ${{ inputs.image_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REF_TYPE}" = tag
          plan=input/plan/release-plan.json
          test "$(jq -r '.route' "${plan}")" = release
          test "$(jq -r '.git_tag' "${plan}")" = "${GITHUB_REF_NAME}"
          test "$(jq -r '.publish.ghcr.enabled' "${plan}")" = true
          test "$(jq -r '.publish.dockerhub.enabled' "${plan}")" = false
          mkdir -p out/receipts context
          PYTHONPATH=.github/release python -m ucm_release compact select \
            --plan "${plan}" --kind image --id "${IMAGE_ID}" \
            --output out/image-task.json >/dev/null
          wheel_id="$(jq -r '.wheel_id' out/image-task.json)"
          target_ref="$(jq -er --arg image "${IMAGE_ID}" \
            '.families[].members[] | select(.image_id == $image) | .reference' \
            "${plan}")"
          case "${target_ref}" in ghcr.io/*:*) ;; *) exit 2 ;; esac
          receipt="out/receipts/member-${IMAGE_ID}.json"
          jq -n --arg id "${IMAGE_ID}" \
            '{kind:"ucm-image-member-receipt",schema_version:1,id:$id,
              status:"failed",targets:[]}' >"${receipt}"
          {
            echo "wheel_artifact=ucm-wheel-${wheel_id}-run-${GITHUB_RUN_ID}"
            echo "target_ref=${target_ref}"
            echo "receipt=${receipt}"
          } >>"${GITHUB_OUTPUT}"
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: ${{ steps.task.outputs.wheel_artifact }}
          path: input/wheel
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Build install-only Runtime image
        run: |
          set -euo pipefail
          wheel="$(find input/wheel -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "${wheel}"
          cp .github/release/docker/Dockerfile.runtime context/Dockerfile
          cp "${wheel}" "context/$(basename "${wheel}")"
          base="$(jq -er '.runtime.image_reference' out/image-task.json)"
          docker buildx build \
            --platform "$(jq -r '.platform' out/image-task.json)" \
            --file context/Dockerfile --target runtime \
            --build-arg "BASE_IMAGE=${base}" \
            --build-arg "UCM_WHEEL=$(basename "${wheel}")" \
            --output type=oci,dest=out/image.oci.tar \
            --progress plain context
          test -s out/image.oci.tar
      - name: Verify Runtime glibc, Python, OS, and UCM import
        env:
          IMAGE_ID: ${{ inputs.image_id }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo
          local_tag="ucm-runtime-check:${IMAGE_ID}"
          wheel_glibc_floor="$(jq -er '.glibc_floor | select(type == "string")' \
            input/wheel/wheel-result.json)"
          skopeo copy "oci-archive:out/image.oci.tar" "docker-daemon:${local_tag}"
          docker run --rm --entrypoint sh \
            -e EXPECTED_PYTHON="$(jq -r '.runtime.python_version' out/image-task.json)" \
            -e EXPECTED_OS_ID="$(jq -r '.runtime.os_id' out/image-task.json)" \
            -e EXPECTED_OS_VERSION="$(jq -r '.runtime.os_version' out/image-task.json)" \
            -e EXPECTED_WHEEL_GLIBC_FLOOR="${wheel_glibc_floor}" \
            "${local_tag}" -c '
              set -eu
              ldd_line="$(ldd --version 2>&1 | head -n 1)"
              actual_glibc="$(printf "%s\n" "${ldd_line}" |
                grep -oE "[0-9]+(\.[0-9]+)+" | head -n 1)"
              wheel_glibc_floor="${EXPECTED_WHEEL_GLIBC_FLOOR#GLIBC_}"
              test -n "${actual_glibc}"
              test -n "${wheel_glibc_floor}"
              printf "Runtime glibc: actual=%s wheel-floor=%s\n" \
                "${actual_glibc}" "${EXPECTED_WHEEL_GLIBC_FLOOR}"
              python3 -c "import sys; parse=lambda value: tuple(map(int, value.split(\".\"))); sys.exit(0 if parse(sys.argv[1]) >= parse(sys.argv[2]) else 1)" \
                "${actual_glibc}" "${wheel_glibc_floor}"
              actual_python="$(python3 -c \
                "import sys; print(\"%d.%d\" % sys.version_info[:2])")"
              test "${actual_python}" = "${EXPECTED_PYTHON}"
              . /etc/os-release
              if [ "${EXPECTED_OS_ID}" != linux ] && \
                 [ "${EXPECTED_OS_ID}" != unreported ]; then
                test "$(printf %s "${ID}" | tr "[:upper:]" "[:lower:]")" = \
                  "$(printf %s "${EXPECTED_OS_ID}" | tr "[:upper:]" "[:lower:]")"
              fi
              if [ "${EXPECTED_OS_VERSION}" != unreported ]; then
                test "${VERSION_ID}" = "${EXPECTED_OS_VERSION}"
              fi
              printf "Runtime OS: actual=%s:%s planned=%s:%s\n" \
                "${ID}" "${VERSION_ID}" "${EXPECTED_OS_ID}" "${EXPECTED_OS_VERSION}"
              python3 -c "import ucm"
            '
      - name: Publish verified GHCR member and record digest
        env:
          TARGET_REF: ${{ steps.task.outputs.target_ref }}
          RECEIPT: ${{ steps.task.outputs.receipt }}
          IMAGE_ID: ${{ inputs.image_id }}
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          skopeo copy "oci-archive:out/image.oci.tar" "docker://${TARGET_REF}"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${TARGET_REF}")"
          jq -n --arg id "${IMAGE_ID}" --arg reference "${TARGET_REF}" \
            --arg digest "${digest}" \
            '{kind:"ucm-image-member-receipt",schema_version:1,id:$id,
              status:"published",
              targets:[{channel:"ghcr",reference:$reference,digest:$digest}]}' \
            >"${RECEIPT}"
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ always() }}
        with:
          name: ucm-image-member-receipt-${{ inputs.image_id }}-run-${{ github.run_id }}
          path: out/receipts/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
