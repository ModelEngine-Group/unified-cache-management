[pytest]
# 独立 rootdir：本目录无 __init__.py，conftest 按顶层模块导入（stub 先于 ucm 包链执行）；
# 从本目录运行时 confcutdir 隔离仓库其他 conftest（E2E 脚手架依赖 pynvml、common.* 等）
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --capture=no
    -p no:cacheprovider
    --ignore=test_gsa_worker.py
    --cov=ucm.sandbox.sparse.gsav2.gsa
    --cov=ucm.sandbox.sparse.gsav2.gsa_tensor_slot_manager_ds
    --cov=ucm.sandbox.sparse.gsav2.gsa_shared_memory
    --cov=ucm.sandbox.sparse.gsav2.gsa_log
    --cov=ucm.sandbox.sparse.gsav2.prefetch.prefetch_engine
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=90

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

norecursedirs = .git venv env __pycache__ *.egg
