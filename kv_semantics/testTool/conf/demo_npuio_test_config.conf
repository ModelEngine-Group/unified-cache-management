# NPU IO 功能测试 demo 的 testTool 配置（HCCP KV-over-RoCE 真实数据面，IO 真实发送至对端 KV store；单实例）
# 配套：test 侧本文件 + kv client 侧 conf/demo_npuio_kv_client.conf（HCCP 链路模板，使用前按其头注释改占位值）
# SOP：sop/4.npu-io-sop.md；输入：input/demo_input.txt
# 前提：以 scripts/build-kv-link.sh --mode npu 构建（testTool 侧 TESTTOOL_ENABLE_ASCEND=ON，
# 否则启动直接报错——不做主机内存模拟，避免误判已测通）
testmode = 2 # 输入带 value（put 种子串写前缀，get 读回完整块）
runtime = 0 # 循环模式，以 loop 为准
loop = 1 # 跑一遍退出
perf = off # 功能测试输出全量明细
onlyconnect = off # 建链 + 下 IO
autodisconnect = 0

startcoreid = 0 # 绑核起始（按环境核数调整；startcoreid+numjobs 不得超过核数）
numjobs = 4 # 并发 worker 线程数

buffersize = 1048576 # 值缓冲单块容量（字节），须不小于 input 单条最大 length
buffercount = 256 # 值缓冲块数，须不小于单任务最大 entry 数
buffertype = npu # ACL NPU 内存（DEVICE；须 TESTTOOL_ENABLE_ASCEND 编入）
deviceid = 0 # ACL device 编号（多卡环境按实际设备改，与 kv client 配置 transport.device_id 一致）

# log 参数（demo 独立目录，不与交付配置的 log/ 混用）
log.dir = log/demo_npu/
log.file_name = tt_%Y%m%d_%H.log
log.get_dir = log/demo_npu/request/
log.get_file_name = get_%Y%m%d_%H.log
log.other_dir = log/demo_npu/request/
log.other_file_name = other_%Y%m%d_%H.log

log.level = info
log.console = on # 功能测试现场同步看控制台
log.pattern = %Y-%m-%d %H:%M:%S.%f TT_%n [%^%L%$] %P,%t [%s:%#,%!]  %v
log.max_file_size = 10485760
log.max_files = 4
log.async_queue_size = 8192
log.async_flush_interval_ms = 100
