<text x="777" y="539" font-size="12" fill="#04342C">E</text>
<text x="777" y="553" font-size="9.5" fill="#085041">fetch</text>
</g>
<text x="645" y="588" text-anchor="middle" font-size="11.5" fill="#085041">no store rewrite — every block stays addressable · B is a GC candidate</text>

<text x="440" y="632" text-anchor="middle" font-size="11.5" fill="#444441">the store holds the full block set in both worlds — no rewrite is ever needed</text>
<text x="440" y="650" text-anchor="middle" font-size="11.5" fill="#444441">the difference is reachability: a plaintext edit orphans the suffix, a KV edit merely skips loading the hole</text>
